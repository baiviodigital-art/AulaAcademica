<style>
/* Layout: barra lateral de navegación + columna de trabajo; en móvil, barra superior y menú desplegable. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef2f8; --line:#d9dfe9; --line-strong:#b9c3d4;
  --ink:#16223a; --ink-2:#44506a; --ink-3:#6b768c;

  --ok:#1f7a4d; --ok-soft:#e2f3ea; --warn:#9a6212; --warn-soft:#fbf0dc; --bad:#b23a3a; --bad-soft:#f9e4e4; --info-soft:#eaeefc;
  --focus:#f2b134;
  --f-display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px; --r-s:6px;
  --shadow:0 1px 2px rgba(22,34,58,.06), 0 2px 8px rgba(22,34,58,.04);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1626; --surface:#162037; --surface-2:#1c2843; --line:#2a3858; --line-strong:#3c4d73;
  --ink:#e8edf7; --ink-2:#b9c3d8; --ink-3:#8b97b2;
  --navy:#0b1222; --navy-ink:#e8edf7; --accent:#7fb0e6; --accent-soft:#1e3352;
  --ok:#6cc79a; --ok-soft:#173a2a; --warn:#e2b25c; --warn-soft:#3a2d14; --bad:#ef8b8b; --bad-soft:#402020; --info-soft:#1f2a4a;
  --shadow:none; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1626; --surface:#162037; --surface-2:#1c2843; --line:#2a3858; --line-strong:#3c4d73;
  --ink:#e8edf7; --ink-2:#b9c3d8; --ink-3:#8b97b2;
  --navy:#0b1222; --navy-ink:#e8edf7; --accent:#7fb0e6; --accent-soft:#1e3352;
  --ok:#6cc79a; --ok-soft:#173a2a; --warn:#e2b25c; --warn-soft:#3a2d14; --bad:#ef8b8b; --bad-soft:#402020; --info-soft:#1f2a4a;
  --shadow:none; color-scheme:dark; }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:var(--navy-ink);padding-block:20px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:1.45rem;font-weight:600;letter-spacing:.2px}
.brand span{font-size:.78rem;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:inherit;text-decoration:none;padding:8px 10px;border-radius:var(--r-s);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.94rem;opacity:.86}
.nav a:hover{background:rgba(255,255,255,.08);opacity:1}
.nav a[aria-current="page"]{background:rgba(255,255,255,.14);opacity:1;font-weight:600}
.nav .grp{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;opacity:.55;margin:12px 10px 4px}
.nav .count{font-family:var(--f-mono);font-size:.75rem;background:rgba(255,255,255,.16);border-radius:20px;padding:0 7px}
.side-foot{margin-top:auto;font-size:.78rem;opacity:.8;display:flex;flex-direction:column;gap:8px}
.side-foot button{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.3);border-radius:var(--r-s);padding:6px 8px;font:inherit;cursor:pointer;text-align:left}
.topbar{display:none}
main{padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));min-width:0}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.lede{color:var(--ink-2);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.between>*{min-width:0;overflow-wrap:anywhere}
.tscroll{overflow-x:auto;max-width:100%}
main{min-width:0}
.muted{color:var(--ink-3)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:.92rem;border-radius:var(--r-s);padding:9px 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1222}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1222} }
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.small{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;border-radius:20px;padding:2px 9px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.dash{border-style:dashed;color:var(--ink-3)}
.chip.src{font-family:var(--f-mono);font-weight:500;font-size:.74rem}
.ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);background:var(--accent-soft);border:none;border-radius:4px;padding:1px 6px;cursor:pointer;white-space:nowrap}
.ref:hover{text-decoration:underline}
.refs{display:flex;gap:5px;flex-wrap:wrap}
.notice{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.notice.warn{background:var(--warn-soft);color:var(--ink)} .notice.info{background:var(--info-soft)} .notice.bad{background:var(--bad-soft)} .notice.ok{background:var(--ok-soft)}
.notice b.ico{font-family:var(--f-mono);flex:none}
label{font-weight:600;font-size:.88rem}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=time],select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-s);padding:8px 10px;width:100%;max-width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.55}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{font-weight:500;display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);padding:4px 8px;font-size:.86rem;background:var(--surface)}
.checks label.off{opacity:.6;border-style:dashed}
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-3)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.tscroll{overflow-x:auto}
.topics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.topic{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;min-height:112px}
.topic.locked{background:transparent;border-style:dashed;color:var(--ink-3)}
.topic:not(.locked):hover{border-color:var(--accent)}
.topic .n{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
.topic h3{font-size:1rem}
.block{border-left:3px solid var(--accent);padding-left:14px}
.block ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.example{background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;font-size:.92rem}
.example .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--warn)}
.qhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q-text{font-size:1.08rem;font-weight:600;line-height:1.45}
.facts{background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:4px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.conf{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flash{border:1px solid var(--line);border-radius:var(--r);padding:22px;background:var(--surface);min-height:150px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.flash .back{border-top:1px dashed var(--line-strong);padding-top:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp > div{background:var(--surface-2);border-radius:var(--r-s);padding:12px;white-space:pre-wrap;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-s);overflow:hidden}
.seg button{font:inherit;font-size:.82rem;border:0;background:var(--surface);color:var(--ink);padding:5px 9px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.timer{font-family:var(--f-mono);font-size:2.4rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.phase{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.phase div{border-radius:var(--r-s);padding:8px;background:var(--surface-2);font-size:.82rem}
.phase div.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--ink-3)}
.next{background:var(--navy);color:#fff;border:none}
.next .eyebrow{color:rgba(255,255,255,.7)}
.next .muted{color:rgba(255,255,255,.75)}
.next .btn{background:#fff;color:var(--navy);border-color:#fff}
.next .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:var(--r);max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.srcpage{font-size:.92rem;white-space:pre-wrap;background:var(--surface-2);padding:12px;border-radius:var(--r-s);overflow-wrap:anywhere}
.toast{position:fixed;bottom:max(16px, env(safe-area-inset-bottom, 0px));right:max(16px, env(safe-area-inset-right, 0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r-s);font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
.sess{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.sess.done{opacity:.65}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:20px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer;font-weight:600}
.timerchip{font-family:var(--f-mono);font-size:.8rem}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spinner{animation:none} }
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width: 1020px){ .topics{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width: 820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none;position:fixed;inset:0;z-index:40;height:100%;padding-top:calc(16px + env(safe-area-inset-top, 0px))}
  .side.open{display:flex}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--navy)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--navy);color:#fff;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));justify-content:space-between;align-items:center;gap:10px}
  .topbar b{font-family:var(--f-display);font-size:1.2rem}
  .topbar button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--r-s);padding:6px 10px;font:inherit;cursor:pointer}
  .g2,.g3,.cmp{grid-template-columns:minmax(0,1fr)}
  .topics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sess{grid-template-columns:minmax(0,1fr)}
  main{padding-block:18px 56px}
  h1{font-size:1.55rem}
}
.side-close{display:none}
@media (max-width: 820px){ #study-grid{grid-template-columns:minmax(0,1fr)!important} .side-close{display:inline-block;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:6px 10px;font:inherit} }
@media (max-width: 420px){ .g4{grid-template-columns:minmax(0,1fr)} .phase{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
<style id="tema-visual">

   #83FD80 como secundario (solo resaltados con texto oscuro). Sin retícula, sin sombras, pocas líneas. */
:root{
  --red:#F42902; --red-text:#C42000; --red-soft:#FFEDE8; --hi:#83FD80; --hi-ink:#0d2b0c;

  --ok:#17631a; --ok-soft:#E3FEE2; --warn:#7a5200; --warn-soft:#FFF4D6; --bad:#B01A00; --bad-soft:#FFEDE8; --info-soft:#F4F4F7;

  --ink:#FDFDFF; --ink-2:#c9c9d1; --ink-3:#8f8f99; --accent:#FF6A4A; --accent-soft:#2e1510; --red-text:#FF6A4A; --red-soft:#2e1510;
  --ok:#83FD80; --ok-soft:#18301a; --warn:#ffcf5c; --warn-soft:#30280f; --bad:#FF6A4A; --bad-soft:#2e1510; --info-soft:#1b1b1e;
  --focus:#83FD80; color-scheme:dark; } }
:root[data-theme="dark"]{

  --ink:#FDFDFF; --ink-2:#c9c9d1; --ink-3:#8f8f99; --accent:#FF6A4A; --accent-soft:#2e1510; --red-text:#FF6A4A; --red-soft:#2e1510;
  --ok:#83FD80; --ok-soft:#18301a; --warn:#ffcf5c; --warn-soft:#30280f; --bad:#FF6A4A; --bad-soft:#2e1510; --info-soft:#1b1b1e;
  --focus:#83FD80; color-scheme:dark; }
body{background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em}

main:focus{outline:none}

2: {

  esquema: [

    ["El empresario laboral", [["T2",6]]],

  ],
  bloques: [
    { id:"t2b1", titulo:"Definición y caracteres",
      texto:[
        "No hay definición legal expresa. A partir del art. 1 ET: contrato por el que una persona se compromete voluntariamente a prestar personalmente servicios retribuidos y por cuenta ajena en el ámbito de organización y dirección de otra (empresario).",
        "Caracteres: bilateral; típico y nominado; recíproco o sinalagmático (con excepciones: periodos en que no se trabaja pero se cobra); oneroso; conmutativo; consensual; normado; de duración (tracto sucesivo)."
      ],
      refs:[["T2",2]],
      check:{ q:"¿Por qué el carácter sinalagmático del contrato de trabajo “no está exento de excepciones”?", a:"Porque hay periodos en los que el trabajador no está obligado a prestar servicios y el empresario sí debe pagar el salario.", ref:["T2",2] } },
    { id:"t2b2", titulo:"Presunción de laboralidad y requisitos del contrato",
      texto:[
        "La calificación que den las partes no determina la naturaleza del contrato: “los contratos son lo que son y no lo que las partes dicen que son”.",
        "Art. 8.1 ET: se presume la existencia de contrato de trabajo entre quien presta un servicio por cuenta y dentro del ámbito de organización y dirección de otro, y quien lo recibe a cambio de una retribución.",
        "Notas: voluntariedad, carácter personal, retribución, subordinación y ajenidad; las dos que dan mayor identidad son subordinación y ajenidad.",
        "Art. 1261 CC: no hay contrato sin consentimiento, objeto cierto y causa."
      ],
      refs:[["T2",3]],
      check:{ q:"¿Qué tres requisitos exige el art. 1261 CC para que exista contrato?", a:"Consentimiento de los contratantes, objeto cierto que sea materia del contrato y causa de la obligación.", ref:["T2",3] } },
    { id:"t2b3", titulo:"Consentimiento",
      texto:[
        "Es la concurrencia de oferta y aceptación sobre objeto y causa; elemento esencial. El contrato se perfecciona por el mero consentimiento (art. 1258 CC), con independencia del inicio de la prestación.",
        "Puede someterse la prestación a término o condición suspensiva. El contrato existe desde el consentimiento: si la prestación no se inicia por causa imputable al empresario, este debe pagar los salarios desde que debió comenzar.",
        "Puede ser expreso, tácito o por actos concluyentes; cuando la ley lo exija, se cumplirá la forma (art. 8 ET)."
      ],
      refs:[["T2",4]],
      ejemplo:"Se firma un contrato el 1 de marzo con inicio el 15 de marzo. El 15 la empresa no da ocupación por causas suyas. Según la regla del tema, debe pagar los salarios desde el 15 de marzo.",
      check:{ q:"Si la prestación no empieza por causa imputable al empresario, ¿desde cuándo debe pagar salarios?", a:"Desde el momento en que debió comenzar la prestación de servicios.", ref:["T2",4] } },
    { id:"t2b4", titulo:"Capacidad del trabajador",
      texto:[
        "Arts. 6 y 7 ET. Menores de 16 años: no aptos para contratar (art. 6.1 ET).",
        "Incapacidad declarada judicialmente: normas generales de contratación (arts. 199 y 200 CC); el grado de incapacidad determina el alcance. El contrato celebrado por persona incapacitada para ello es nulo.",
        "Capacidad limitada (art. 7.b ET): mayores de 16 y menores de 18 con autorización de padres, tutor o institución. Es autorización, no representación: contrata el menor.",
        "Capacidad plena (art. 7.a ET): mayores de 18 (art. 315 CC) y menores de 16 a 18 que no convivan con sus padres o tutores ni vivan a sus expensas."
      ],
      refs:[["T2",5],["T2",6]],
      check:{ q:"Un menor de 17 años que vive con sus padres quiere trabajar. ¿Quién firma el contrato?", a:"El propio menor, con autorización de sus padres (autorización, no representación).", ref:["T2",5] } },
    { id:"t2b5", titulo:"El empresario laboral",
      texto:[
        "Art. 1.2 ET: puede serlo cualquier persona física, jurídica o comunidad de bienes que reciba servicios voluntarios, retribuidos, subordinados y por cuenta ajena.",
        "Empresario aparente: responde como empresario quien contrata aparentando ser titular de una empresa sin serlo.",
        "Grupo de empresas: en principio cada empresa es independiente; si concurren circunstancias adicionales, la jurisprudencia “levanta el velo” y declara responsables solidarias a todas."
      ],
      refs:[["T2",6]],
      check:{ q:"¿Qué consecuencia tiene que la jurisprudencia “levante el velo” en un grupo de empresas?", a:"Considera responsables solidarias a todas las empresas que integran el grupo.", ref:["T2",6] } },
    { id:"t2b6", titulo:"Objeto, causa y forma",
      texto:[
        "Objeto: trabajo personal, voluntario, dependiente y por cuenta ajena; debe ser posible (art. 1272 CC) y lícito (art. 1271 CC).",
        "Causa: intercambio de trabajo por salario, dirigido a una función social de producción (art. 1274 CC).",
        "Forma: puede celebrarse por escrito o de palabra. Debe constar por escrito en los supuestos del art. 8.2 ET (el tema enumera, entre otros, prácticas y formación, duración determinada, tiempo parcial, ETT, contratos con periodo de prueba o pacto de permanencia).",
        "Si falta la forma escrita obligatoria: infracción grave (art. 7.1 LISOS) y presunción de contrato indefinido y a tiempo completo, salvo prueba en contrario (art. 8.2 ET).",
        "Art. 8.5 ET y RD 1659/1998: si el contrato supera cuatro semanas, información escrita de los elementos esenciales en dos meses desde el inicio, salvo que ya figuren en el contrato escrito."
      ],
      refs:[["T2",7],["T2",8],["T2",9]],
      check:{ q:"¿Qué se presume si no se formaliza por escrito un contrato que debía serlo?", a:"Que es de duración indefinida y a tiempo completo, salvo prueba en contrario (art. 8.2 ET).", ref:["T2",9] } },
    { id:"t2b7", titulo:"Periodo de prueba",
      texto:[
        "Regulado por convenio y, en su defecto, por el art. 14 ET. No es una modalidad de contrato, sino una fase inicial en la que quedan en suspenso las normas de extinción.",
        "No es automático (salvo excepción: servicio del hogar familiar); debe pactarse por escrito (ab solemnitatem). No vale si el trabajador ya desempeñó las mismas funciones ni si se pacta iniciada la relación.",
        "Duración máxima según el tema: seis meses para técnicos titulados; dos o tres meses para el resto según la empresa tenga 25 o más trabajadores o menos de 25; un mes en contratos temporales del art. 15 de hasta seis meses, salvo convenio.",
        "Ambas partes pueden extinguir sin causa ni indemnización, pero la extinción discriminatoria es nula. Superado, computa a efectos de antigüedad. Pasado el periodo, la empresa no puede alegar una ineptitud anterior (art. 52.a ET)."
      ],
      refs:[["T2",9],["T2",10]],
      check:{ q:"¿Es válido un periodo de prueba pactado una vez iniciada la relación laboral?", a:"No. Tampoco si el trabajador ya había desempeñado las mismas funciones.", ref:["T2",10] } },
    { id:"t2b8", titulo:"Agencias de colocación y empresas de selección",
      texto:[
        "Agencias de colocación: entidades públicas o privadas, con o sin ánimo de lucro, que en coordinación con el Servicio Público de Empleo realizan intermediación laboral. El tema indica que la agencia autorizada por el SEPE realiza la intermediación de forma gratuita y que la empresa tiene la última palabra en la elección.",
        "Empresa de selección: busca y selecciona candidatos con entrevistas, pruebas psicológicas y evaluaciones técnicas.",
        "Reclutamiento busca al candidato; selección decide cuál es el adecuado."
      ],
      refs:[["T2",11],["T2",12]],
      check:{ q:"¿Cuál es la diferencia entre reclutamiento y selección?", a:"El reclutamiento busca candidatos (ofertas, búsqueda); la selección decide cuál es el adecuado para el puesto.", ref:["T2",12] } }
  ],

3: {

  ],
  bloques: [
    { id:"t3b1", titulo:"Descentralización productiva",
      texto:[
        "Una empresa principal decide no realizar directamente determinadas fases o actividades y se sirve de empresas auxiliares.",
        "Ventajas: reducción de costes, especialización, flexibilidad en la gestión, conocer costes del proceso. Desventajas: pérdida de control sobre el producto, menor calidad, desmotivación, desigualdad laboral, precariedad, problemas de información y regulación.",
        "Tipos: contratas y subcontratas, subrogación por transmisión de empresa, formas de cesión ilícita, ETT, franquicias, teletrabajo, contratación de autónomos."
      ],
      refs:[["T3",2],["T3",3]],
      check:{ q:"Cita dos desventajas laborales de la descentralización productiva según el tema.", a:"Por ejemplo: desigualdad laboral (mismas funciones, condiciones distintas) y aumento de flexibilidad y precariedad (contratos temporales).", ref:["T3",2] } },
    { id:"t3b2", titulo:"Contratas de la propia actividad (art. 42 ET)",
      texto:[
        "Encargar a otra empresa la ejecución de tareas es admisible. El negocio entre principal y auxiliar puede ser civil, mercantil o administrativo; el segundo nivel es una subcontrata. Según el tema, en construcción el máximo es de 3 subcontratas.",
        "Tres cuestiones previas: (a) que sea una verdadera contrata y no cesión ilegal; (b) que corresponda a la “propia actividad”: labores inherentes a la producción de los bienes o servicios que el comitente coloca en el mercado o indispensables de su ciclo productivo; (c) incluye contratas privadas y con administraciones públicas.",
        "No excluye la propia actividad que sea complementaria pero inherente y estrictamente necesaria."
      ],
      refs:[["T3",4],["T3",5],["T3",6]],
      check:{ q:"¿Qué entiende el TS, según el tema, por “propia actividad”?", a:"Operaciones o labores inherentes a la producción de los bienes o servicios específicos que el comitente presta o coloca en el mercado, o que forman parte de la actividad indispensable de su ciclo productivo.", ref:["T3",5] } },
    { id:"t3b3", titulo:"Responsabilidades en contratas",
      texto:[
        "Seguridad y salud: si las empresas solo coinciden en el local, deben cooperar (art. 24.1 LPRL); con contratas en el mismo centro, responsabilidad in vigilando y solidaria por incumplimiento.",
        "Salarial (solo propia actividad): solidaria durante el año siguiente a la finalización del encargo, por las deudas salariales del periodo de la contrata; solo salario.",
        "Seguridad Social: solidaria durante los 3 años siguientes en propia actividad; subsidiaria si es otro tipo de actividad. El principal queda exonerado si pide certificado de que la subcontrata no tiene deudas y no las tiene.",
        "Tributaria: subsidiaria respecto a Hacienda por las retenciones.",
        "Información (art. 42.3 ET): la auxiliar informa a sus trabajadores de la principal; la principal informa a los representantes de sus previsiones de subcontratación y, al formalizarla, de la empresa, duración, número de trabajadores y medidas de coordinación de PRL."
      ],
      refs:[["T3",6],["T3",7],["T3",8]],
      check:{ q:"¿Durante cuánto tiempo responde solidariamente la principal de las deudas salariales de la contratista de la propia actividad?", a:"Durante el año siguiente a la finalización del encargo, y solo por el salario.", ref:["T3",7] } },
    { id:"t3b4", titulo:"Cesión ilegal de trabajadores (art. 43 ET)",
      texto:[
        "Art. 43.1 ET: contratar trabajadores para cederlos temporalmente solo cabe a través de ETT autorizadas. Excepciones citadas: ETT y cesiones de deportistas profesionales.",
        "Hay cesión ilegal cuando: el objeto se limita a la mera puesta a disposición; la cedente carece de actividad u organización propia y estable o de medios; o no ejerce las funciones inherentes a su condición de empresario.",
        "Criterios: el contratista debe tener infraestructura suficiente (no basta con trámites formales), organizar y dirigir la actividad y asumir un verdadero riesgo empresarial sobre una actividad específica y delimitada. Puede haber cesión ilegal entre empresas reales si su organización “no se ha puesto en juego”.",
        "Consecuencias: responsabilidad solidaria de ambos empresarios (salariales, no salariales y Seguridad Social); posible sanción penal (art. 312 CP); el trabajador adquiere la condición de fijo, a su elección, en la cedente o la cesionaria, con antigüedad desde el inicio de la cesión."
      ],
      refs:[["T3",9],["T3",10],["T3",11],["T3",12]],
      ejemplo:"Una sociedad sin clientes ni medios propios contrata a tres personas y las envía a trabajar en la oficina de otra empresa, que les da órdenes y horarios. Con los criterios del tema, el objeto se limita a una mera puesta a disposición y la cedente carece de organización propia.",
      check:{ q:"En una cesión ilegal, ¿dónde puede el trabajador adquirir la condición de fijo?", a:"A su elección, en la empresa cedente o en la cesionaria.", ref:["T3",10] } },
    { id:"t3b5", titulo:"ETT y contrato de puesta a disposición",
      texto:[
        "ETT: su actividad fundamental es poner a disposición de una empresa usuaria (EU), con carácter temporal, trabajadores contratados por ella. Relación triangular: el trabajador queda sometido a dos empresarios.",
        "Tienen trabajadores estructurales (internos) y trabajadores para ceder. Pueden actuar también como agencias de colocación, formación y consultoría de RR. HH.",
        "Contrato de puesta a disposición (art. 6.1 LETT): la ETT cede temporalmente un trabajador para que preste servicios, bajo su poder de dirección, a la EU. Se formaliza por escrito (art. 6.3 LETT).",
        "Si el trabajador sigue prestando servicios en la EU al finalizar, se considera vinculado a ella por contrato indefinido."
      ],
      refs:[["T3",13],["T3",14],["T3",15],["T3",16],["T3",19]],
      check:{ q:"¿Qué ocurre si el trabajador cedido sigue trabajando en la EU tras finalizar el contrato de puesta a disposición?", a:"Se considera vinculado a la empresa usuaria por contrato indefinido.", ref:["T3",16] } },
    { id:"t3b6", titulo:"Supuestos prohibidos de ETT",
      texto:[
        "Art. 8 LETT. No cabe acudir a una ETT:",
        "a) para sustituir a trabajadores huelguistas; b) para trabajos especialmente peligrosos (DA 2.ª LETT); c) si en los doce meses anteriores la empresa amortizó esos puestos por despido improcedente o por los arts. 50, 51 y 52.c ET, salvo fuerza mayor; d) para ceder trabajadores a otra ETT; e) para puestos sin evaluación de riesgos (arts. 15.1.b y 16 LPRL; art. 12.3 LETT); f) para tareas reservadas a funcionarios (DA 4.ª LETT)."
      ],
      refs:[["T3",18]],
      check:{ q:"¿Puede una empresa usar una ETT para cubrir a trabajadores en huelga?", a:"No. Es un supuesto prohibido del art. 8 LETT.", ref:["T3",18] } },
    { id:"t3b7", titulo:"Derechos del trabajador cedido y reparto de deberes",
      texto:[
        "Art. 11 LETT: derecho a las condiciones esenciales que tendría si le contratase directamente la EU (remuneración, jornada, horas extra, descansos, trabajo nocturno, vacaciones, festivos). Si el contrato es temporal, indemnización de doce días por año de servicio a la finalización del CPD (o la que fije la normativa específica).",
        "ETT: obligaciones salariales y de Seguridad Social; destinar el 1 % de la masa salarial a formación; asegurar formación en PRL; nula toda cláusula que obligue a pagar a la ETT gastos de selección, formación o contratación.",
        "EU: facultades de dirección y control (art. 15.1 LETT); la ETT conserva las disciplinarias y la EU le comunica los incumplimientos (art. 15.2 LETT). La EU informa de los riesgos, responde de la seguridad e higiene y del recargo de prestaciones (art. 164 LGSS), y responde subsidiariamente de salarios, Seguridad Social e indemnización por extinción (salvo contratos contrarios a los arts. 6 y 8 LETT).",
        "Reclamaciones sobre las condiciones de ejecución: a través de los representantes de la EU (art. 17 LETT)."
      ],
      refs:[["T3",19],["T3",20],["T3",21],["T3",22],["T3",23],["T3",24]],
      check:{ q:"¿Quién ejerce el poder disciplinario sobre el trabajador cedido por una ETT?", a:"La ETT; la EU debe poner los incumplimientos en su conocimiento (art. 15.2 LETT).", ref:["T3",22] } }
  ],

  bloques: [
    { id:"t4b1", titulo:"Indefinido y temporal",
      texto:[
        "Art. 15 ET: el contrato puede ser por tiempo indefinido o de duración determinada; por jornada, a tiempo completo o parcial.",
        "El indefinido no es vitalicio; es más favorable para el trabajador por su estabilidad.",
        "El de duración determinada fija un término o condición resolutoria. La alta temporalidad ha llevado a incentivar la contratación indefinida."
      ],
      refs:[["T4",2]],
      check:{ q:"¿Significa “indefinido” que el contrato sea vitalicio?", a:"No. El contrato indefinido puede extinguirse por diversas causas.", ref:["T4",2] } },
    { id:"t4b2", titulo:"Causalidad y fraude de ley",
      texto:[
        "Los contratos temporales requieren causa (lista cerrada, criterio restrictivo). Son indefinidos los celebrados en fraude de ley (art. 6.4 CC).",
        "El fraude no se presume: lo prueba quien lo alega. Hay fraude cuando no se acredita, no se utiliza o no se alega la causa. Si se cubre una necesidad permanente, el contrato debe ser fijo.",
        "Si hay fraude y el trabajador cobró desempleo entre contratos, la entidad gestora puede reclamar esas cantidades al empresario.",
        "En la empresa privada el fraude convierte al trabajador en indefinido y fijo; en la Administración, en indefinido no fijo (igualdad, mérito y capacidad): solo pasa a fijo si gana la oposición."
      ],
      refs:[["T4",3],["T4",4],["T4",5]],
      check:{ q:"¿Quién debe probar el fraude en la contratación temporal?", a:"Quien lo alega; el fraude no se presume.", ref:["T4",3] } },
    { id:"t4b3", titulo:"Conversión de prórrogas y encadenamiento",
      texto:[
        "Conversión de prórrogas: si el trabajador sigue prestando servicios una vez finalizada la duración máxima, pasa a indefinido (presunción iuris tantum).",
        "Encadenamiento (art. 15.5 ET, en la redacción que cita el tema): quienes en un periodo de 30 meses hayan estado contratados más de 24 meses, con o sin solución de continuidad, para el mismo o diferente puesto, en la misma empresa o grupo, mediante dos o más contratos temporales (directamente o a través de ETT) adquieren la condición de fijos.",
        "Se computa todo el tiempo contratado temporalmente dentro de los 30 meses; no hace falta que sea seguido.",
        "La negociación colectiva puede establecer requisitos para evitar el uso abusivo de temporales con distintos trabajadores en el mismo puesto.",
        "La reforma 32/2021 refiere las reglas de encadenamiento no solo al trabajador, sino también al puesto de trabajo."
      ],
      refs:[["T4",6],["T4",7],["T4",8],["T4",9],["T4",28],["T4",33]],
      ejemplo:"Un trabajador encadena contratos temporales en la misma empresa: 10 meses, pausa de 3, 9 meses, pausa de 2 y 6 meses. Son 25 meses contratado dentro de un marco de 30. Con la regla del tema, adquiere la condición de fijo.",
      check:{ q:"¿Hace falta trabajar 24 meses seguidos para que opere la regla de encadenamiento?", a:"No: se suman los periodos con o sin solución de continuidad dentro del marco de 30 meses.", ref:["T4",8] } },
    { id:"t4b4", titulo:"Igualdad y desincentivos a la temporalidad",
      texto:[
        "Igualdad entre temporales e indefinidos: retributiva, en prevención de riesgos, electoral y en cómputo de antigüedad.",
        "Indemnización por extinción: el tema recoge 12 días por año para eventuales y obra o servicio, no para interinidad, y advierte de pronunciamientos del TJUE y tribunales españoles que exigen indemnizar también la interinidad (20 días con máximo de 12 mensualidades), sin modificación del ET.",
        "Mayores costes de Seguridad Social en contratos inferiores a 7 días (salvo interinidad): 36 % en cuota por contingencias comunes.",
        "Incentivos: reducciones de cotización, ayudas autonómicas, conversión por convenio, forma escrita de temporales (salvo inferiores a 4 semanas), información de vacantes.",
        "Penalizaciones: infracción grave; no dar de alta o no cotizar desde el inicio genera presunción iuris tantum de contrato indefinido; fijeza en cesiones ilegales."
      ],
      refs:[["T4",11],["T4",12],["T4",13],["T4",14],["T4",15]],
      check:{ q:"¿Qué presunción genera no dar de alta al trabajador desde el inicio de la relación?", a:"Presunción iuris tantum de carácter indefinido del contrato.", ref:["T4",15] } },
    { id:"t4b5", titulo:"Temporales acausales y causales (regulación que recoge el tema antes de la reforma)",
      texto:[
        "Acausales: formativos, relevo (art. 12.6 ET), fomento de empleo de discapacitados, ciertas relaciones especiales, investigación pública, empresas de inserción.",
        "Causales (art. 15 ET y RD de 1998): obra o servicio determinado, interinidad (sustitución o vacante) y eventual por circunstancias del mercado, exceso de pedidos o acumulación de tareas.",
        "Las págs. 18-22 describen obra o servicio (máximo 3 años + 12 meses por convenio), eventual (6 meses en 12) e interinidad (vacante: máximo 3 meses).",
        "Atención: la pág. 28 indica que, tras la reforma 32/2021, desaparece el contrato de obra o servicio y quedan el de circunstancias de la producción y el de sustitución. Consulta la sección de discrepancias."
      ],
      refs:[["T4",16],["T4",17],["T4",18],["T4",19],["T4",20],["T4",28]],
      check:{ q:"Según la pág. 28, ¿qué contratos de duración determinada quedan tras la reforma 32/2021?", a:"El de circunstancias de la producción (antes eventual) y el de sustitución de una persona trabajadora (antes interinidad).", ref:["T4",28] } },
    { id:"t4b6", titulo:"Reforma 32/2021 y contrato formativo",
      texto:[
        "Objetivos de la reforma: simplificar contratos, generalizar el indefinido, devolver la causalidad al temporal y reformar los formativos. Vacatio legis de tres meses para formativo y temporal estructural.",
        "Contrato formativo (págs. 26-27): compatibilizar trabajo con formación (FP, universidad, Catálogo del SNE). Menores de 30 años (excepción: discapacitados). Mínimo 3 meses y máximo 2 años, continuados o alternos; prórrogas sin superar 2 años.",
        "Tiempo parcial: no más del 65 % el primer año ni del 85 % el segundo. Prohibidas horas extraordinarias y complementarias (salvo fuerza mayor); trabajo nocturno y a turnos solo si no hay otra forma.",
        "Plan formativo individual y dos tutores (empresa y centro)."
      ],
      refs:[["T4",23],["T4",24],["T4",25],["T4",26],["T4",27]],
      check:{ q:"Según la pág. 26, ¿cuál es la duración mínima y máxima del contrato formativo?", a:"Mínimo 3 meses y máximo 2 años, continuados o alternos.", ref:["T4",26] } },
    { id:"t4b7", titulo:"Contrato por circunstancias de la producción",
      texto:[
        "Causa: incremento ocasional e imprevisible de la actividad y oscilaciones que generan un desajuste temporal entre el empleo estable y el requerido, siempre que no sean supuestos de fijo discontinuo (art. 16.1). Incluye oscilaciones por vacaciones anuales.",
        "Imprevisibles: máximo 6 meses, ampliable por convenio sectorial hasta un año (art. 15.2). Todo temporal debe concretar su “duración prevista” (art. 15.1).",
        "Ocasionales y previsibles de duración reducida y delimitada: máximo 90 días en el año natural, no continuados (mínimo dos periodos); previsión anual a la representación en el último trimestre.",
        "Ejemplos del propio tema: hostelería en fines de semana → fijo discontinuo o indefinido a tiempo parcial; eventos (bodas, bautizos, comuniones) → fijo discontinuo, o eventual si se refuerza la plantilla habitual por un incremento puntual."
      ],
      refs:[["T4",28],["T4",29],["T4",30],["T4",31],["T4",32]],
      check:{ q:"¿Cuántos días al año puede usarse el contrato por circunstancias ocasionales y previsibles, y cómo?", a:"Un máximo de 90 días en el año natural, que no pueden utilizarse de manera continuada (mínimo dos periodos).", ref:["T4",29] } },
    { id:"t4b8", titulo:"Sustitución, fijo discontinuo e indefinido adscrito a obra",
      texto:[
        "Sustitución (art. 15.3 ET): no se aplican las reglas de encadenamiento; el tema indica que no procede indemnización; debe constar el nombre del sustituido y la causa; sustituto y sustituido pueden coincidir hasta 15 días.",
        "Fijo discontinuo (art. 16): trabajos estacionales o de temporada, o intermitentes con periodos de ejecución ciertos, determinados o indeterminados; también contratas mercantiles o civiles. En inactividad, baja en SS sin ERTE. Antigüedad por toda la relación.",
        "Indefinido adscrito a obra (construcción): finalización de obra comunicada a la RLT con 5 días; formación y propuesta de recolocación; el trabajador responde en 7 días (silencio = rechazo); extinción notificada con 15 días; indemnización del 7 % sobre conceptos salariales del convenio; situación legal de desempleo."
      ],
      refs:[["T4",34],["T4",35],["T4",36],["T4",37],["T4",38],["T4",39],["T4",40]],
      check:{ q:"Si el trabajador adscrito a obra no contesta a la propuesta de recolocación en 7 días, ¿qué se entiende?", a:"Que rechaza la propuesta de recolocación.", ref:["T4",39] } }
  ],

5: {
  titulo: "Los poderes del empresario y deberes del trabajador",
  fuentes: ["T5"],
  esquema: [
    ["Poderes empresariales: dirección, control y disciplinario", [["T5",2],["T5",3],["T5",4]]],
    ["Derechos fundamentales y deber de buena fe del empresario", [["T5",5],["T5",6]]],
    ["Encuadramiento profesional, grupos profesionales y polivalencia", [["T5",7],["T5",8],["T5",9]]],
    ["Diligencia, colaboración, concurrencia desleal, plena dedicación y no competencia", [["T5",10],["T5",11],["T5",12],["T5",13]]],
    ["Obediencia y facultades de control", [["T5",14],["T5",15],["T5",16],["T5",17],["T5",18]]],
    ["Poder disciplinario, procedimiento, prescripción y revisión judicial", [["T5",19],["T5",20],["T5",21],["T5",22],["T5",23],["T5",24],["T5",25],["T5",26]]]
  ],
  bloques: [
    { id:"t5b1", titulo:"Los tres poderes empresariales",
      texto:[
        "Por la subordinación, el empleador tiene: poderes directivos (organizar y dar órdenes, con deber de obediencia), poderes de control (vigilar el cumplimiento) y poderes disciplinarios (sancionar incumplimientos).",
        "El poder de dirección es intransmisible de forma independiente (la cesión de trabajadores es ilícita, salvo ETT, art. 43 ET), pero puede delegarse: hay que informar al trabajador de quiénes son sus superiores.",
        "Controles: son nulas las decisiones discriminatorias o que afecten a la vida privada; control sindical (representantes) y judicial (tutela judicial efectiva)."
      ],
      refs:[["T5",2],["T5",3],["T5",4]],
      check:{ q:"¿Es lo mismo transmitir que delegar el poder de dirección?", a:"No: no puede transmitirse de forma independiente, pero sí delegarse en otra persona.", ref:["T5",3] } },
    { id:"t5b2", titulo:"Derechos fundamentales y buena fe",
      texto:[
        "Los poderes privados también están sujetos a los derechos fundamentales. El TC afirma que el empleador queda sometido a ellos.",
        "Son nulos los preceptos reglamentarios, cláusulas de convenios, pactos individuales y decisiones unilaterales que contengan discriminaciones directas o indirectas.",
        "Buena fe: obligación de ambas partes (art. 20.2 ET). Además del salario, deberes típicos del empresario: facilitar medios e instrucciones, formación y reciclaje, información de expectativas, facilitar las experiencias del periodo de prueba."
      ],
      refs:[["T5",5],["T5",6]],
      check:{ q:"Cita dos deberes del empresario derivados de la buena fe distintos de pagar el salario.", a:"Por ejemplo: facilitar medios e instrucciones; proporcionar formación y reciclaje; informar de expectativas profesionales; facilitar las experiencias del periodo de prueba.", ref:["T5",6] } },
    { id:"t5b3", titulo:"Encuadramiento y grupos profesionales",
      texto:[
        "El trabajo a prestar se pacta mediante el sistema de clasificación profesional fijado en la negociación colectiva (art. 22.1 ET), por grupos profesionales, sin discriminación entre mujeres y hombres (art. 22.3 ET).",
        "Grupo profesional: agrupa unitariamente aptitudes, titulaciones y contenido general de la prestación; puede incluir diversas tareas, funciones, especialidades o responsabilidades.",
        "Polivalencia funcional: el pacto puede concretar la prestación o, lo más previsible, comprometer funciones más variadas."
      ],
      refs:[["T5",7],["T5",8],["T5",9]],
      check:{ q:"¿Quién establece el sistema de clasificación profesional según el art. 22.1 ET?", a:"La negociación colectiva (o, según el tema, la ley se remite a ella).", ref:["T5",7] } },
    { id:"t5b4", titulo:"Pluriempleo, plena dedicación y no competencia",
      texto:[
        "Diligencia, colaboración y buena fe: la relación se basa en la confianza mutua.",
        "Pluriempleo: la regla general es la libertad (derecho al trabajo y libre elección de profesión). Excepciones: concurrencia desleal y pacto expreso de plena dedicación.",
        "Plena dedicación (art. 21.3 ET): trabajar para un único empresario, por cuenta ajena y propia, con “compensación económica expresa”.",
        "No competencia postcontractual (art. 21.2 ET): debe pactarse expresamente (no necesita forma escrita, pero sí probarse). Requisitos: efectivo interés comercial o industrial, duración máxima y compensación económica adecuada."
      ],
      refs:[["T5",10],["T5",11],["T5",12],["T5",13]],
      check:{ q:"¿Qué tres requisitos exige el tema para la validez del pacto de no competencia postcontractual?", a:"Efectivo interés comercial o industrial del empresario, duración máxima del pacto y compensación económica adecuada.", ref:["T5",13] } },
    { id:"t5b5", titulo:"Obediencia y control",
      texto:[
        "El trabajador debe cumplir las órdenes, pero la obediencia no supone sometimiento absoluto ni legaliza la autoridad arbitraria.",
        "Art. 20.3 ET: el empresario puede adoptar las medidas de vigilancia y control que estime oportunas, con la consideración debida a la dignidad humana y teniendo en cuenta la capacidad real de los trabajadores disminuidos.",
        "Control de salud en bajas: el despido no puede declararse procedente solo por negarse a reconocimientos; se admite la vigilancia por detectives durante la baja.",
        "Registros sobre la persona, taquillas y efectos: respetando al máximo la dignidad e intimidad; para proteger el patrimonio del empleador o la plantilla.",
        "Registro de jornada (Ley 8/2019 según el tema): registro diario de entrada y salida, conservado al menos 4 años, a disposición de empleados, sindicatos e Inspección."
      ],
      refs:[["T5",14],["T5",15],["T5",16],["T5",17],["T5",18]],
      check:{ q:"¿Cuánto tiempo debe conservar la empresa el registro de jornada?", a:"Al menos 4 años.", ref:["T5",18] } },
    { id:"t5b6", titulo:"Poder disciplinario: tipicidad y proporcionalidad",
      texto:[
        "Potestad de sancionar a los trabajadores que incurren, de forma culpable, en conductas tipificadas por la ley o los convenios como faltas.",
        "Es un poder privado, no una sanción pública. Permite reaccionar ante incumplimientos que no justifican el despido.",
        "Tipicidad (art. 58.1 ET): solo conductas tipificadas en las disposiciones legales o el convenio aplicable. Proporcionalidad: graduación en leves, graves y muy graves. Culpabilidad: la conducta debe ser imputable al trabajador.",
        "La diapositiva de límites menciona: reducción de la duración de las vacaciones, minoración del derecho de descanso y multa de haber."
      ],
      refs:[["T5",19],["T5",20],["T5",21],["T5",22]],
      check:{ q:"¿Qué exige el principio de tipicidad en el poder disciplinario?", a:"Que solo se sancionen conductas tipificadas como faltas en las disposiciones legales o en el convenio colectivo aplicable (art. 58.1 ET).", ref:["T5",21] } },
    { id:"t5b7", titulo:"Procedimiento, prescripción y revisión",
      texto:[
        "Decisión unilateral notificada. Faltas graves y muy graves: por escrito con los hechos y la fecha de efectos, bajo sanción de nulidad (art. 58.2 ET). Leves: pueden ser verbales salvo que el convenio exija escrito.",
        "Afiliado a sindicato: audiencia al delegado sindical (art. 10.3.3 LOLS). Informar a la representación de las sanciones por faltas muy graves. Representantes sancionados por faltas graves o muy graves: expediente contradictorio.",
        "Prescripción: leves 10 días, graves 20 días, muy graves 60 días desde que la empresa conoce el hecho; en todo caso 6 meses desde la comisión.",
        "Revisión judicial ante el orden social (arts. 114 y 115 LJS): plazo de 20 días hábiles. El poder disciplinario tiene ejecutividad inmediata. El empresario debe probar la veracidad y entidad de los hechos."
      ],
      refs:[["T5",23],["T5",24],["T5",25],["T5",26]],
      ejemplo:"La empresa conoce el 2 de mayo una falta grave cometida el 20 de abril. Con los plazos del tema, debe sancionar dentro de los 20 días desde el 2 de mayo y nunca después de 6 meses desde el 20 de abril.",
      check:{ q:"¿Qué plazo tiene el trabajador para impugnar judicialmente una sanción?", a:"20 días hábiles.", ref:["T5",26] } }
  ],
  conceptos: [

C("t2c1",2,2,"Explica la naturaleza y el régimen del periodo de prueba.",{
  imprescindibles:["Fase inicial del contrato, no una modalidad, en la que quedan en suspenso las normas de extinción","No es automático: debe pactarse por escrito (ab solemnitatem)","Invalidez si ya desempeñó las mismas funciones o si se pacta iniciada la relación","Duración máxima (art. 14 ET o convenio)","Extinción sin causa ni indemnización, salvo discriminación (nula)"],
  complementarios:["Derechos y obligaciones de un trabajador normal; alta y cotización","Computa para la antigüedad","No puede alegarse después una ineptitud anterior (art. 52.a ET)","Excepción del trabajo al servicio del hogar familiar"],
  pistas:["¿Es una modalidad de contrato o una fase?","¿Qué forma exige?","¿Hay algún límite a la libre extinción?"],
  modelo:"El periodo de prueba, regulado por convenio y en su defecto por el art. 14 ET, no es una modalidad de contrato sino una fase inicial del contrato en la que quedan en suspenso las normas de extinción. No es automático: debe pactarse por escrito (ab solemnitatem) y no es válido si el trabajador ya había desempeñado las mismas funciones o si se pacta una vez iniciada la relación. Tiene duraciones máximas (seis meses para técnicos titulados, dos o tres meses para el resto según el tamaño de la empresa, un mes en temporales del art. 15 de hasta seis meses, salvo convenio). Durante el periodo, el trabajador tiene los derechos y obligaciones de cualquier trabajador y debe estar de alta. Ambas partes pueden extinguir sin causa ni indemnización, pero la extinción discriminatoria es nula. Superado, computa a efectos de antigüedad y la empresa ya no puede alegar una ineptitud anterior.",

C("t2c2",2,2,"Explica el consentimiento como elemento del contrato de trabajo y qué ocurre si la prestación se somete a término o condición.",{
  imprescindibles:["Concurrencia de oferta y aceptación sobre objeto y causa; elemento esencial","Contrato consensual: se perfecciona por el consentimiento (art. 1258 CC) con independencia del inicio de la prestación","Término o condición suspensiva no suponen inexistencia del contrato","Si no se inicia por causa imputable al empresario, debe pagar salarios desde que debió comenzar"],
  complementarios:["Libre y voluntario; expreso, tácito o por actos concluyentes","Requisitos de forma cuando la ley lo exija (art. 8 ET)","Capacidad para consentir"],
  pistas:["¿Desde cuándo existe el contrato?","¿Qué debe pagar el empresario si retrasa por su culpa el inicio?"],
  modelo:"El consentimiento es la manifestación de la voluntad concurrente de las partes, el concurso de oferta y aceptación sobre el objeto y la causa, y es el elemento esencial del contrato. El contrato de trabajo es consensual: se perfecciona por el mero consentimiento (art. 1258 CC), con independencia de cuándo empiece la prestación. Por eso puede someterse la prestación a un término o a una condición suspensiva sin que el contrato deje de existir; si la prestación no se inicia por causa imputable al empresario, este debe pagar los salarios desde el momento en que debió comenzar. El consentimiento debe ser libre y voluntario, puede ser expreso, tácito o por actos concluyentes, requiere capacidad y debe cumplir la forma en los casos que exija la ley (art. 8 ET).",
  refs:[["T2",4]]}),
C("t2c3",2,3,"Explica qué es el empresario laboral y las figuras del empresario aparente y del grupo de empresas.",{
  imprescindibles:["Art. 1.2 ET: persona física, jurídica o comunidad de bienes que recibe servicios voluntarios, retribuidos, subordinados y por cuenta ajena","Empresario aparente: responde quien contrata aparentando ser titular sin serlo","Grupo: en principio cada empresa es independiente","Levantamiento del velo con circunstancias adicionales: responsabilidad solidaria de todas"],
  complementarios:["Titular de la organización en que se insertan los servicios"],
  pistas:["Empieza por el art. 1.2 ET.","¿Basta con que una sociedad tenga el capital de otra?"],
  modelo:"Conforme al art. 1.2 ET, empresario laboral puede ser cualquier persona física, jurídica o comunidad de bienes que reciba servicios voluntarios, retribuidos, subordinados y por cuenta ajena; es el titular de la organización en que se insertan esos servicios. La jurisprudencia considera también responsable como empresario a quien contrata aparentando ser titular de una empresa sin serlo (empresario aparente). En los grupos de empresas, los vínculos económicos (por ejemplo, una sociedad con todo el capital de otra) no impiden que, en principio, cada empresa sea independiente; pero si concurren circunstancias adicionales, la jurisprudencia levanta el velo de la personalidad jurídica y declara responsables solidarias a todas las empresas del grupo.",

K("t2k1",2,2,"Contrato verbal y periodo de prueba tardío",
  "Andrés empezó a trabajar como dependiente en una tienda el 1 de septiembre tras un acuerdo verbal, sin fecha de fin y a jornada completa. El 20 de septiembre la empresa le pidió firmar un documento con un periodo de prueba de dos meses. El 10 de octubre la empresa le comunica la extinción “por no superar el periodo de prueba”, sin indicar causa. Andrés ya había trabajado en esa tienda, con las mismas funciones, durante el verano anterior.",
  [{id:"a",q:"¿Existía contrato de trabajo aunque no se firmara nada el 1 de septiembre?",
    imprescindibles:["El contrato es consensual y puede celebrarse por escrito o de palabra","Presunción de contrato de trabajo cuando se trabaja por cuenta y dentro del ámbito de organización de otro (art. 8.1 ET)"],
    modelo:"Sí. El contrato de trabajo existe desde que las partes prestan su consentimiento y puede celebrarse por escrito o de palabra. Además, el art. 8.1 ET presume la existencia de contrato cuando una persona trabaja por cuenta y dentro del ámbito de organización y dirección de otra a cambio de retribución, como ocurre aquí."},
   {id:"b",q:"¿Es válido el periodo de prueba? Razona con los hechos.",
    imprescindibles:["Debe pactarse por escrito y no es válido si se pacta una vez iniciada la relación","No es válido si el trabajador ya había desempeñado las mismas funciones","Aplicación: se pactó el 20 de septiembre (ya iniciada) y había hecho las mismas funciones","Conclusión: periodo de prueba inválido; la extinción no puede ampararse en él"],
    modelo:"No. El periodo de prueba debe pactarse por escrito y el temario indica que no es válido si se pacta una vez iniciada la relación laboral o si el trabajador ya había desempeñado las mismas funciones. Aquí se pactó el 20 de septiembre, cuando la relación había comenzado el día 1, y Andrés ya había hecho las mismas funciones en la tienda. Por cualquiera de las dos razones, el pacto no es válido y la empresa no puede ampararse en él para extinguir sin causa."}],
  [["T2",3],["T2",4],["T2",8],["T2",10]],
  "El temario no detalla qué calificación tendría la extinción si el periodo de prueba es inválido; si te lo piden, responde que no se puede resolver con el material de los temas 1-6 y qué información faltaría."),
K("t2k2",2,3,"Menor de edad e inicio aplazado",

C("t4c1",4,2,"Explica el principio de causalidad en la contratación temporal y las consecuencias del fraude.",{
  imprescindibles:["Los temporales exigen una causa legal (lista cerrada, criterio restrictivo)","Contratos en fraude de ley son indefinidos (art. 6.4 CC)","El fraude no se presume: lo prueba quien lo alega","Empresa privada: indefinido fijo; Administración: indefinido no fijo"],
  complementarios:["Hay fraude cuando no se acredita, utiliza o alega la causa; si se cubre una necesidad permanente, debe ser fijo","La entidad gestora puede reclamar el desempleo cobrado entre contratos"],
  pistas:["¿Qué pasa si se cubre una necesidad permanente con un temporal?","Distingue empresa privada y Administración."],
  modelo:"Según el principio de causalidad, los contratos temporales solo pueden celebrarse si concurre una de las causas legales, que forman una lista cerrada e interpretada restrictivamente; si se cubre una necesidad permanente, el contrato debe ser fijo. Son indefinidos los contratos temporales celebrados en fraude de ley (art. 6.4 CC), es decir, con una finalidad distinta a la legal o sin acreditar la causa. El fraude no se presume: lo debe probar quien lo alega. Probado el fraude, en la empresa privada el trabajador pasa a ser indefinido y fijo; en la Administración, indefinido no fijo para proteger la igualdad, el mérito y la capacidad, y solo será fijo si gana la oposición. Además, si cobró desempleo entre contratos, la entidad gestora puede reclamarlo al empresario.",
  refs:[["T4",3],["T4",4],["T4",5]]}),
C("t4c2",4,2,"Explica el contrato por circunstancias de la producción tras la reforma 32/2021.",{
  imprescindibles:["Causa: incremento ocasional e imprevisible y oscilaciones (incluidas vacaciones) que generan desajuste temporal, salvo supuestos de fijo discontinuo","Imprevisibles: máximo 6 meses, ampliable a 1 año por convenio sectorial","Previsibles de duración reducida y delimitada: 90 días/año, no continuados","Debe concretarse la duración prevista y la causa en el contrato"],
  complementarios:["Previsión anual a la representación en el último trimestre","Ejemplos del tema (hostelería, eventos)"],
  pistas:["Hay dos modalidades.","¿Cuál es el límite de días en el año natural?"],
  modelo:"Tras la reforma 32/2021, el antiguo contrato eventual pasa a ser el contrato por circunstancias de la producción. Su causa es el incremento ocasional e imprevisible de la actividad y las oscilaciones que, aun siendo la actividad normal, generan un desajuste temporal entre el empleo estable y el necesario (incluidas las derivadas de las vacaciones), siempre que no sean supuestos de fijo discontinuo. Tiene dos modalidades: por circunstancias imprevisibles, con una duración máxima de 6 meses ampliable por convenio sectorial hasta un año; y por situaciones ocasionales y previsibles de duración reducida y delimitada, que solo puede usarse un máximo de 90 días en el año natural y de forma no continuada, debiendo trasladar la empresa una previsión anual a la representación en el último trimestre. Todo contrato temporal debe concretar su causa y su duración prevista.",
  refs:[["T4",28],["T4",29],["T4",30]]}),
C("t4c3",4,3,"Explica el régimen de extinción del contrato indefinido adscrito a obra.",{
  imprescindibles:["Finalización de obra (terminación real, disminución real o paralización)","Información a la RLT con 5 días y propuesta de recolocación (previa formación si es necesaria)","Respuesta del trabajador en 7 días; el silencio equivale a rechazo","Extinción por motivos inherentes a la persona trabajadora con preaviso de 15 días e indemnización del 7 %"],
  complementarios:["No se considera despido colectivo","Situación legal de desempleo","No aplicable al personal de estructura"],
  pistas:["Ordena los pasos: finalización → información → formación → recolocación → respuesta → extinción."],
  modelo:"El indefinido adscrito a obra se aplica a tareas vinculadas a obras de construcción del ámbito del convenio del sector, no al personal de estructura. Cuando la obra finaliza (terminación real y verificable, disminución real del volumen o paralización imprevisible), la empresa informa a la RLT con 5 días de antelación y debe ofrecer formación, si es necesaria, y una propuesta de recolocación por escrito. El trabajador debe responder en 7 días; si no contesta, se entiende que rechaza. El contrato puede extinguirse por motivos inherentes a la persona trabajadora (rechazo, falta de cualificación o inexistencia de obras adecuadas en la provincia), con notificación de 15 días, indemnización del 7 % sobre los conceptos salariales del convenio y situación legal de desempleo; no se considera despido colectivo.",
  refs:[["T4",36],["T4",37],["T4",38],["T4",39],["T4",40]]}),

    imprescindibles:["Incremento ocasional e imprevisible","Contrato por circunstancias de la producción (imprevisibles), con causa y duración prevista","Límite: 6 meses ampliable a 1 año por convenio sectorial"],

C("t5c1",5,2,"Explica los principios y el procedimiento del poder disciplinario del empresario.",{
  imprescindibles:["Poder privado para sancionar conductas culpables tipificadas por ley o convenio","Tipicidad (art. 58.1 ET) y proporcionalidad (leves, graves, muy graves)","Graves y muy graves: por escrito con hechos y fecha, bajo nulidad (art. 58.2 ET)","Revisión judicial: 20 días hábiles; el empresario prueba los hechos"],
  complementarios:["Culpabilidad","Audiencia al delegado sindical; información a la representación de las muy graves; expediente contradictorio para representantes","Prescripción 10/20/60 días y 6 meses","Ejecutividad inmediata"],
  pistas:["Empieza por la definición de la pág. 19.","¿Qué forma exigen las sanciones graves?","¿Cuánto tiempo tiene el trabajador para impugnar?"],
  modelo:"El poder disciplinario es la potestad del empresario de sancionar a sus trabajadores cuando incurren, de forma culpable, en conductas tipificadas como faltas por la ley o el convenio. Es un poder privado, no una sanción pública. Rige la tipicidad: solo pueden sancionarse las conductas previstas en las disposiciones legales o el convenio aplicable (art. 58.1 ET), y la proporcionalidad, con graduación en faltas leves, graves y muy graves; además, la conducta debe ser imputable al trabajador. Se ejerce por decisión unilateral notificada: las sanciones graves y muy graves se comunican por escrito con los hechos y la fecha de efectos, bajo sanción de nulidad (art. 58.2 ET). Si el trabajador está afiliado, se oye al delegado sindical; las muy graves se comunican a la representación y, si el sancionado es representante, hace falta expediente contradictorio. Las faltas prescriben a los 10, 20 o 60 días desde que la empresa las conoce y, en todo caso, a los 6 meses. La sanción es inmediatamente ejecutiva y el trabajador puede impugnarla en 20 días hábiles; corresponde al empresario probar los hechos.",
  refs:[["T5",19],["T5",21],["T5",23],["T5",24],["T5",25],["T5",26]]}),
C("t5c2",5,2,"Explica las facultades de control del empresario y sus límites.",{
  imprescindibles:["Art. 20.3 ET: medidas de vigilancia y control que estime oportunas","Límite: consideración debida a la dignidad humana (y capacidad real de trabajadores disminuidos)","Control de salud en bajas: el despido no es procedente solo por negarse al reconocimiento; detectives admitidos","Registros sobre persona, taquillas y efectos respetando dignidad e intimidad"],
  complementarios:["Cualquier medio, incluidos tecnológicos","Registro de jornada: diario, conservación 4 años, acceso de empleados, sindicatos e Inspección"],
  pistas:["¿Qué artículo del ET habilita el control?","Enumera los tipos de control de las págs. 15-18."],
  modelo:"El art. 20.3 ET permite al empresario adoptar las medidas de vigilancia y control que estime oportunas para verificar el cumplimiento de las obligaciones laborales, incluidos medios tecnológicos, pero guardando la consideración debida a la dignidad humana, sin menoscabo de la intimidad y teniendo en cuenta la capacidad real de los trabajadores disminuidos. En las bajas puede controlar la salud ante posibles enfermedades ficticias; la negativa a un reconocimiento no basta por sí sola para un despido procedente, y la jurisprudencia admite la vigilancia por detectives. Puede registrar a la persona, sus taquillas y efectos para proteger el patrimonio de la empresa o la plantilla, respetando al máximo la dignidad e intimidad. Además, debe llevar un registro diario de jornada, conservarlo al menos cuatro años y ponerlo a disposición de trabajadores, sindicatos e Inspección.",
  refs:[["T5",15],["T5",16],["T5",17],["T5",18]]}),
C("t5c3",5,3,"¿Puede un trabajador tener dos empleos? Explica la regla general y sus excepciones.",{
  imprescindibles:["Regla general: libertad de pluriempleo (derecho al trabajo y libre elección de profesión)","Excepción 1: concurrencia desleal","Excepción 2: pacto expreso de plena dedicación con compensación económica expresa (art. 21.3 ET)"],
  complementarios:["La exclusividad alcanza trabajo por cuenta ajena y propia","Tras el contrato: pacto de no competencia (art. 21.2 ET) con sus requisitos","El deber de no concurrencia desleal solo rige durante el contrato"],
  pistas:["Pág. 11: regla y dos excepciones."],
  modelo:"Como regla general, sí. Celebrar un contrato de trabajo no impide realizar otras actividades por cuenta propia o trabajar para otros empleadores: el derecho al trabajo y la libre elección de profesión amparan el pluriempleo. Hay dos excepciones: la concurrencia desleal y el pacto expreso de plena dedicación, por el que el trabajador se compromete a trabajar para un único empresario, tanto por cuenta ajena como propia, a cambio de una compensación económica expresa (art. 21.3 ET). El deber de no concurrencia desleal solo rige mientras dura el contrato; para extenderlo después hay que pactar expresamente la no competencia postcontractual (art. 21.2 ET), con interés comercial o industrial, duración máxima y compensación adecuada.",
  refs:[["T5",11],["T5",12],["T5",13]]}),

const TZ = "Atlantic/Canary";

function canaryParts(d = new Date()){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  const o = {}; for (const p of f.formatToParts(d)) o[p.type] = p.value;
  return {y:+o.year, m:+o.month, d:+o.day, h:+(o.hour==="24"?0:o.hour), mi:+o.minute};
}
function today(){ const p = canaryParts(); return `${p.y}-${String(p.m).padStart(2,"0")}-${String(p.d).padStart(2,"0")}`; }
function addDays(iso, n){ const [y,m,d] = iso.split("-").map(Number); const dt = new Date(Date.UTC(y,m-1,d+n)); return dt.toISOString().slice(0,10); }
function daysBetween(a, b){ const pa=a.split("-").map(Number), pb=b.split("-").map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000); }
function weekday(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); } // 0 domingo
/* Convierte "YYYY-MM-DDTHH:mm" interpretado en hora canaria a Date */
function canaryLocalToDate(local){
  if (!local) return null;
  const [dpart, tpart="00:00"] = local.split("T"); const [y,m,d] = dpart.split("-").map(Number); const [h,mi] = tpart.split(":").map(Number);
  let guess = Date.UTC(y,m-1,d,h,mi);
  for (let i=0;i<2;i++){ const p = canaryParts(new Date(guess)); const asUTC = Date.UTC(p.y,p.m-1,p.d,p.h,p.mi); guess += Date.UTC(y,m-1,d,h,mi) - asUTC; }
  return new Date(guess);
}

const fmtDL = iso => { const [y,m,d]=iso.slice(0,10).split("-").map(Number); return new Intl.DateTimeFormat("es-ES",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long"}).format(new Date(Date.UTC(y,m-1,d))); };
const fmtTS = ts => new Intl.DateTimeFormat("es-ES",{timeZone:TZ,day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(ts));

function refValid(r){ const f = FMAP[r?.[0]]; return !!(f && f.paginas && f.paginas[r[1]] !== undefined); }
const refBtn = r => `<button type="button" class="ref" data-act="ver-ref" data-src="${esc(r[0])}" data-p="${esc(r[1])}" title="${esc(refFull(r))}">${esc(refLabel(r))}</button>`;

/* ---- Estado ---- */
const DEFAULT_STATE = () => ({
  v:1, updatedAt:0,
  prefs:{ intervalos:[1,3,7,14], correccion:"ia", tema:"sistema" },
  evals:[], leido:{}, checks:{}, intentos:[], repaso:{}, tiempo:[], plan:null, sims:[],
  importados:{fuentes:[],temas:{},preguntas:[],alertas:[],evaluaciones:[]}, revision:{}, timer:null
});
let S = DEFAULT_STATE();
const STORE = { mode:"local", db:null, col:null, status:"Comprobando dónde se guarda…", lastSave:null, error:null };

function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return null;
}
function normalize(st){
  const d = DEFAULT_STATE();
  const o = Object.assign(d, st || {});
  o.prefs = Object.assign(DEFAULT_STATE().prefs, (st||{}).prefs || {});
  o.importados = Object.assign(DEFAULT_STATE().importados, (st||{}).importados || {});
  for (const k of ["evals","intentos","tiempo","sims"]) if (!Array.isArray(o[k])) o[k] = [];
  for (const k of ["leido","checks","repaso","revision"]) if (!o[k] || typeof o[k] !== "object") o[k] = {};
  return o;
}
let saveTimer = null; const dirtyAttempts = new Set(); const dirtySims = new Set(); let dirtyEstado = false, dirtyImp = false;
function save(opts={}){
  S.updatedAt = Date.now();
  if (opts.intento) dirtyAttempts.add(opts.intento);
  if (opts.sim) dirtySims.add(opts.sim);
  if (opts.imp) dirtyImp = true;
  dirtyEstado = true;
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {}
  clearTimeout(saveTimer); saveTimer = setTimeout(flushRemote, 700);
}
async function flushRemote(){
  if (STORE.mode !== "cuenta" || !STORE.col) return;
  try {
    for (const id of [...dirtyAttempts]){ const a = S.intentos.find(x=>x.id===id); if (a) await STORE.col.doc("i_"+id).set(a); dirtyAttempts.delete(id); }
    for (const id of [...dirtySims]){ const s = S.sims.find(x=>x.id===id); if (s) await STORE.col.doc("s_"+id).set(s); dirtySims.delete(id); }
    if (dirtyImp){ await STORE.col.doc("importados").set({data: JSON.stringify(S.importados)}); dirtyImp = false; }
    if (dirtyEstado){
      const {intentos, sims, importados, ...rest} = S;
      await STORE.col.doc("estado").set({data: JSON.stringify(rest)}); dirtyEstado = false;
    }
    STORE.lastSave = Date.now(); STORE.error = null;
  } catch(e){ STORE.error = (e && (e.code || e.message)) || "error"; }
  renderStatus();
}
async function initStore(){
  const local = loadLocal();
  S = normalize(local);
  rebuildData();
  STORE.status = "Solo en este navegador";
  if (!window.claude || typeof window.claude.use !== "function"){ STORE.status = "Solo en este navegador (sin conexión con tu cuenta)"; return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e) {}
  if (!db || !user){ STORE.status = "Solo en este navegador (el guardado en tu cuenta no está disponible en esta vista)"; renderStatus(); return; }
  let id = null; try { id = await user.id(); } catch(e) {}
  if (!id){ STORE.status = "Solo en este navegador (no se ha podido identificar tu cuenta)"; renderStatus(); return; }
  try {
    const col = db.collection("data/users/" + id);
    const snap = await Promise.race([col.get(), new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
    const remote = { intentos:[], sims:[] }; let estado = null, imp = null;
    for (const d of snap.docs){
      const v = d.data(); if (!v) continue;
      if (d.id === "estado") { try { estado = JSON.parse(v.data); } catch(e){} }
      else if (d.id === "importados") { try { imp = JSON.parse(v.data); } catch(e){} }
      else if (d.id.startsWith("i_")) remote.intentos.push(v);
      else if (d.id.startsWith("s_")) remote.sims.push(v);
    }
    STORE.mode = "cuenta"; STORE.col = col; STORE.db = db;
    const hasRemote = estado || remote.intentos.length;
    if (hasRemote){
      const merged = normalize(Object.assign({}, (estado && (!local || (estado.updatedAt||0) >= (local.updatedAt||0))) ? estado : (local || estado)));
      const im = new Map(); for (const a of [...(local?.intentos||[]), ...remote.intentos]) im.set(a.id, a);
      merged.intentos = [...im.values()].sort((a,b)=>a.ts-b.ts);
      const sm = new Map(); for (const s of [...(local?.sims||[]), ...remote.sims]) sm.set(s.id, s);
      merged.sims = [...sm.values()];
      merged.importados = normalize({importados: imp || local?.importados}).importados;
      S = merged;
      for (const a of S.intentos) if (!remote.intentos.find(r=>r.id===a.id)) dirtyAttempts.add(a.id);
    } else if (local){
      for (const a of S.intentos) dirtyAttempts.add(a.id);
      for (const s of S.sims) dirtySims.add(s.id);
      dirtyImp = true;
    }
    rebuildData();
    STORE.status = "Guardado en tu cuenta de Claude";
    save();
  } catch(e){
    STORE.status = "Solo en este navegador (no se pudo leer tu cuenta: " + esc(e.code || e.message || "error") + ")";
  }
  renderStatus(); render();
}
function renderStatus(){ const el = document.getElementById("store-status"); if (el) el.innerHTML = storeStatusHTML(); }
function storeStatusHTML(){
  const ok = STORE.mode === "cuenta";
  let t = `<span>${ok?"●":"○"} ${esc(STORE.status)}</span>`;
  if (STORE.error) t += `<span>No se pudo guardar el último cambio en tu cuenta (${esc(STORE.error)}). Sigue guardado en este navegador.</span>`;
  else if (STORE.lastSave) t += `<span class="tiny">Último guardado: ${fmtTS(STORE.lastSave)}</span>`;

}

const REGLAS_IA = `Eres corrector y tutor de Derecho Laboral para un estudiante universitario de ADE en España. Escribe en español de España.
REGLAS OBLIGATORIAS:

4. Si el material no permite evaluar o responder, dilo: "No se puede resolver con el material disponible" y explica qué falta.
5. No penalices una redacción distinta si el contenido es correcto. No premies la extensión. No confundas palabras clave con comprensión. No presentes preferencias de estilo como errores jurídicos.

function fragmentos(refs, extra=0){
  const set = new Map();
  for (const r of refs || []){
    const f = FMAP[r[0]]; if (!f) continue;
    for (let p = r[1]-extra; p <= r[1]+extra; p++) if (f.paginas[p]) set.set(`${r[0]}|${p}`, {fuente:r[0], pagina:p, tema:f.tema, texto:f.paginas[p]});
  }
  return [...set.values()];
}
function cleanRefs(arr, allowed){
  const ok = [], bad = [];
  for (const x of arr || []){
    const r = [String(x.fuente||x[0]||""), Number(x.pagina||x[1])];
    if (refValid(r) && (!allowed || allowed.has(`${r[0]}|${r[1]}`))) ok.push(r); else bad.push(r);
  }
  return {ok, bad};
}
async function aiCorregir(q, respuesta){

  const prompt = `${REGLAS_IA}

TAREA: Corrige la respuesta del estudiante. Primero aplica la rúbrica propuesta (es una propuesta de entrenamiento, no la del profesor). Devuelve SOLO un objeto JSON con esta forma:
{"resultado":"correcta|parcialmente_correcta|incorrecta|no_evaluable",
 "aciertos":["..."], "omisiones":["elemento imprescindible que falta, con su explicación"], "errores":[{"texto":"lo que dijo","por_que":"por qué es un error según el material"}],
 "criterios":[{"criterio":"nombre","maximo":n,"obtenido":n,"comentario":"..."}],
 "nota":número de 0 a 10 o null si no es evaluable,

DATOS (JSON):
${JSON.stringify(payload)}`;
  const out = await AI.fn.json(prompt, {modelTier:"default"});

    errores:(out.errores||[]).map(e=>({texto:String(e.texto||""), por_que:String(e.por_que||"")})),

}
async function aiPreguntar(tema, pregunta){
  const t = TEMAS[tema]; const frs = [];
  for (const id of t.fuentes){ const f = FMAP[id]; if (!f) continue; for (const [p,txt] of Object.entries(f.paginas)) if (txt && txt.length > 40) frs.push({fuente:id, pagina:+p, texto:txt}); }

  const out = await AI.fn.json(prompt, {modelTier:"default"});

function aiErrorMsg(e){

/* ---- Intentos, repaso y estados ---- */
function lastAttempt(qid){ for (let i=S.intentos.length-1;i>=0;i--) if (S.intentos[i].qid===qid) return S.intentos[i]; return null; }
function attemptsOf(qid){ return S.intentos.filter(a=>a.qid===qid); }
function registrarIntento(a){
  a.id = a.id || uid("i"); a.ts = a.ts || Date.now();
  S.intentos.push(a);
  if (a.resultado !== "no_evaluable") programarRepaso(a);
  save({intento:a.id});
  return a;
}
function programarRepaso(a){
  const iv = S.prefs.intervalos.length ? S.prefs.intervalos : [1,3,7,14];
  const r = S.repaso[a.qid] || {paso:-1};
  if (a.resultado === "correcta") r.paso = Math.min((r.paso < 0 ? 0 : r.paso + 1), iv.length - 1);
  else r.paso = 0;
  const dias = a.resultado === "correcta" ? iv[r.paso] : iv[0];
  r.proximo = addDays(today(), dias);
  r.ultimo = a.resultado; r.confianza = a.confianza; r.ts = a.ts;
  if (a.tipoError) r.tipoError = a.tipoError;
  S.repaso[a.qid] = r;
}
function pendientesRepaso(){
  const hoy = today(); const out = [];
  for (const [qid, r] of Object.entries(S.repaso)){
    const q = QMAP[qid]; if (!q || !temaDisponible(q.tema)) continue;
    if (r.proximo && r.proximo <= hoy) out.push({q, r, prio: (r.ultimo !== "correcta" ? 2 : 0) + (r.ultimo !== "correcta" && r.confianza === 3 ? 2 : 0) + (r.ultimo === "parcial" ? -1 : 0) + daysBetween(r.proximo, hoy)*0.1});
  }
  return out.sort((a,b)=>b.prio-a.prio);
}
const EVALUABLES = q => q.tipo === "corta" || q.tipo === "caso";
function temaStats(n){
  const qs = PREGUNTAS.filter(q=>q.tema===n);
  const escritas = qs.filter(EVALUABLES);
  const ints = S.intentos.filter(a => QMAP[a.qid]?.tema === n && a.resultado !== "no_evaluable");
  const ultimos = qs.map(q=>({q, a:lastAttempt(q.id)})).filter(x=>x.a && x.a.resultado !== "no_evaluable");
  const escritasCorrectas = ultimos.filter(x=>EVALUABLES(x.q) && x.a.resultado==="correcta").length;
  const escritasFalladas = ultimos.filter(x=>EVALUABLES(x.q) && x.a.resultado!=="correcta").length;
  const bloques = (TEMAS[n]?.bloques||[]);
  const leidos = bloques.filter(b=>S.leido[b.id]).length;
  const hoy = today();
  const vencidas = qs.filter(q=>S.repaso[q.id]?.proximo && S.repaso[q.id].proximo <= hoy).length;
  return {qs, escritas, ints, ultimos, escritasCorrectas, escritasFalladas, bloques:bloques.length, leidos, vencidas};
}
function estadoTema(n){
  if (!temaDisponible(n)) return "pendiente";
  const s = temaStats(n);
  const tocado = s.leidos > 0 || s.ints.length > 0;
  if (!tocado) return "disponible";
  const dominio = s.escritas.length && s.escritasCorrectas >= Math.min(3, s.escritas.length) && s.escritasCorrectas / s.escritas.length >= 0.6 && s.escritasFalladas === 0 && s.vencidas === 0;
  if (dominio) return "dominio";
  if (s.vencidas > 0 || s.escritasFalladas > 0) return "repaso";
  return "estudio";
}
const ESTADOS = {
  pendiente:{t:"Pendiente de recibir", c:"dash", i:"○"},
  disponible:{t:"Disponible", c:"", i:"◇"},
  estudio:{t:"En estudio", c:"info", i:"◐"},
