};
const estadoChip = n => { const e = ESTADOS[estadoTema(n)]; return `<span class="chip ${e.c}"><span aria-hidden="true">${e.i}</span> ${e.t}</span>`; };
const RES = {
  correcta:{t:"Correcta", c:"ok", i:"✓"}, parcial:{t:"Parcialmente correcta", c:"warn", i:"◐"},
  incorrecta:{t:"Incorrecta", c:"bad", i:"✗"}, no_evaluable:{t:"No evaluable", c:"", i:"–"}
};
const resChip = r => { const x = RES[r] || RES.no_evaluable; return `<span class="chip ${x.c}"><span aria-hidden="true">${x.i}</span> ${x.t}</span>`; };
const TIPOS_ERROR = { falta_de_recuerdo:"Falta de recuerdo", confusion_conceptual:"Confusión conceptual", aplicacion_incorrecta:"Aplicación incorrecta", justificacion_insuficiente:"Justificación insuficiente" };
const CONF = {1:"Baja",2:"Media",3:"Alta"};

/* ---- Interfaz común ---- */
function toast(msg){ const r = document.getElementById("toast-root"); r.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(()=>{ r.innerHTML = ""; }, 3200); }
function modal(html){ document.getElementById("modal-root").innerHTML = `<div class="modal-bg" data-act="close-modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}<div class="row"><button class="btn" type="button" data-act="close-modal">Cerrar</button></div></div></div>`; const m = document.querySelector(".modal"); m && m.querySelector("button,input,textarea,select")?.focus(); }

function showRef(src, p){

  const txt = f.paginas[p];
  const max = Math.max(...Object.keys(f.paginas).map(Number));
  modal(`<div class="eyebrow">Material de la asignatura · ${esc(f.formato)}</div><h2>${f.doc ? esc(f.doc) : `Tema ${f.tema}: ${esc(f.titulo)}`}</h2>
  <p class="small muted mono">${esc(f.file)} · ${esc(f.version)} · ${esc(f.unidad)} ${esc(p)} de ${max}</p>
  ${f.textoOmitido ? `<div class="notice"><b class="ico">i</b><span>Esta versión pública no incluye el texto del temario. Consulta tu archivo <span class="mono">${esc(f.file)}</span>, ${esc(f.unidad)} ${esc(p)}.</span></div>` : txt ? `<div class="srcpage">${esc(txt)}</div>` : `<div class="notice warn"><b class="ico">!</b><span>Esta ${esc(f.unidad)} no contiene texto legible.</span></div>`}
  <p class="tiny muted">Texto extraído del archivo aportado. Las marcas “[Transcrito de imagen]” indican diapositivas que solo tenían imagen y se transcribieron al incorporar el tema.</p>
  <div class="row">${p>1?`<button class="btn small" type="button" data-act="ver-ref" data-src="${esc(src)}" data-p="${p-1}">← ${esc(f.unidad)} ${p-1}</button>`:""}${p<max?`<button class="btn small" type="button" data-act="ver-ref" data-src="${esc(src)}" data-p="${p+1}">${esc(f.unidad)} ${p+1} →</button>`:""}</div>`);
}

<script>

  const pend = pendientesRepaso().length;
  const errs = cuadernoItems().filter(x=>x.abierto).length;
  let html = `<div class="between"><div class="brand"><b class="logo" aria-label="Aula Laboral"><span>AULA</span><span>LABORAL</span></b><span>Derecho Laboral · ADE</span></div><button type="button" class="side-close" data-act="menu">Cerrar</button></div><div class="nav">`;
  let grp = "";
  for (const [id, name, g] of ROUTES){
    if (g !== grp){ html += `<div class="grp">${g}</div>`; grp = g; }
    const cur = VIEW.name === id || (id==="biblioteca" && VIEW.name==="tema") || (id==="banco" && VIEW.name==="practicar");
    const cnt = id==="errores" && errs ? `<span class="count" title="Preguntas con errores abiertos">${errs}</span>` : (id==="inicio" && pend ? `<span class="count" title="Preguntas pendientes de repasar">${pend}</span>` : "");
    html += `<a href="#${id}" ${cur?'aria-current="page"':""}>${name}${cnt}</a>`;
  }
  html += `</div><div class="side-foot"><div id="store-status" class="stack-s">${storeStatusHTML()}</div>
  <div>IA para corregir: ${AI.status==="si" ? "disponible" : AI.status==="no" ? "no disponible (autoevaluación guiada)" : "comprobando…"}</div>
  <button type="button" data-act="theme">Tema de color: ${({sistema:"según el sistema",light:"claro",dark:"oscuro"})[S.prefs.tema]}</button>
  <div id="timer-side" class="timerchip"></div></div>`;
  document.getElementById("side").innerHTML = html;
}
function applyTheme(){ const t = S.prefs.tema; if (t === "sistema") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }

function render(){
  applyTheme(); renderNav();
  const v = VIEW.name; let html = "";
  try {
    const fn = { inicio:vInicio, biblioteca:vBiblioteca, tema:vTema, estudiar:vEstudiar, banco:vBanco, practicar:vPracticar, errores:vErrores, simulador:vSimulador, plan:vPlan, guia:vGuia, progreso:vProgreso, datos:vDatos }[v] || vInicio;

  } catch(e){ console.error(e); html = `<div class="notice bad"><b class="ico">!</b><span>Se produjo un error al mostrar esta sección: ${esc(e.message)}. Tus datos no se han modificado.</span></div>`; }

  updateTimerUI();
  afterRender();
}
const afterHooks = []; function afterRender(){ while (afterHooks.length) { try { afterHooks.shift()(); } catch(e){ console.error(e); } } }

/* ---------- INICIO ---------- */
function proximaEval(){
  const now = Date.now();
  return S.evals.map(e=>({...e, d:canaryLocalToDate(e.fecha)})).filter(e=>e.d && e.d.getTime() > now - 3*3600e3).sort((a,b)=>a.d-b.d)[0] || null;
}
function countdown(d){
  const ms = d.getTime() - Date.now(); if (ms <= 0) return "En curso o finalizada";
  const dias = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000), m = Math.floor(ms%3600000/60000);
  return dias > 0 ? `${dias} ${dias===1?"día":"días"} y ${h} h` : `${h} h ${m} min`;
}
function sesionRecomendada(){
  const pend = pendientesRepaso();
  const ev = proximaEval();
  const disp = temasDisponibles();
  const scope = ev ? ev.temas.filter(temaDisponible) : disp;
  if (pend.length >= 3) return {titulo:`Repasar ${Math.min(pend.length,8)} preguntas vencidas`, por:`Tienes ${pend.length} preguntas cuyo repaso toca hoy. Empieza por las falladas con confianza alta.`, act:`data-act="run-repaso"`, btn:"Empezar repaso"};
  const sinTocar = scope.find(n=>estadoTema(n)==="disponible");
  const conFallos = scope.filter(n=>estadoTema(n)==="repaso");
  if (conFallos.length) { const n = conFallos[0]; return {titulo:`Tema ${n}: reintentar preguntas escritas`, por:"Tienes respuestas escritas incorrectas o parciales en este tema.", act:`data-act="run-tema" data-tema="${n}" data-nivel="3"`, btn:"Practicar el tema "+n}; }
  if (sinTocar) return {titulo:`Tema ${sinTocar}: comprender y comprobar`, por:"Aún no has trabajado este tema. Lee un bloque y responde su pregunta de comprobación.", act:`data-act="open-estudiar" data-tema="${sinTocar}"`, btn:"Estudiar el tema "+sinTocar};
  const enEstudio = scope.find(n=>estadoTema(n)==="estudio");
  if (enEstudio) return {titulo:`Tema ${enEstudio}: aplicar con preguntas cortas y un caso`, por:"Has estudiado este tema pero todavía no hay evidencia suficiente de dominio por escrito.", act:`data-act="run-tema" data-tema="${enEstudio}" data-nivel="3"`, btn:"Aplicar el tema "+enEstudio};
  return {titulo:"Simulacro breve de los temas disponibles", por:"Todos los temas del alcance muestran dominio o están al día. Comprueba bajo tiempo.", act:`href="#simulador"`, btn:"Ir al simulador", link:true};
}
function vInicio(){
  const ev = proximaEval(); const rec = sesionRecomendada(); const pend = pendientesRepaso();
  const disp = temasDisponibles();
  const btn = rec.link ? `<a class="btn" ${rec.act}>${esc(rec.btn)}</a>` : `<button class="btn" type="button" ${rec.act}>${esc(rec.btn)}</button>`;

      <p class="mono" style="font-size:1.4rem" data-countdown="${ev.d.getTime()}">${countdown(ev.d)}</p>

  return `
  <div class="between"><div class="stack-s"><div class="eyebrow">${fmtDL(today())}</div><h1>Mi mesa de estudio</h1></div>
    <div class="row"><a class="btn" href="#estudiar">Estudiar</a><a class="btn" href="#banco">Practicar</a><a class="btn" href="#simulador">Simular examen</a></div></div>
  <section class="card next stack" aria-label="Siguiente acción">
    <div class="eyebrow">Siguiente acción útil</div>
    <h2>${esc(rec.titulo)}</h2><p class="muted">${esc(rec.por)}</p><div class="row">${btn}</div>
  </section>
  <div class="grid g3">
    <section class="card">${evHTML}</section>
    <section class="card stack-s"><div class="eyebrow">Material</div>
      <div class="kpi"><b>${disp.length} de ${TEMAS_TOTAL}</b><span>temas disponibles</span></div>
      <p class="small">Disponibles: ${disp.join(", ") || "ninguno"}.</p><p class="small muted">Pendientes de recibir: ${Array.from({length:TEMAS_TOTAL},(_,i)=>i+1).filter(n=>!temaDisponible(n)).join(", ")}.</p></section>
    <section class="card stack-s"><div class="eyebrow">Repaso</div>
      <div class="kpi"><b>${pend.length}</b><span>preguntas pendientes de repasar hoy</span></div>
      ${pend.length ? `<button class="btn small" type="button" data-act="run-repaso">Repasar ahora</button>` : `<p class="small muted">Nada vencido. Las preguntas que respondas se programarán aquí.</p>`}</section>
  </div>

    <div class="legend"><span style="--c:var(--accent)">Material trabajado (bloques abiertos)</span></div></div>

    <div class="tscroll"><table><thead><tr><th>Tema</th><th>Estado</th><th>Trabajado</th><th>Dominio demostrado</th></tr></thead><tbody>${filas || `<tr><td colspan="4">No hay temas disponibles.</td></tr>`}</tbody></table></div>

      <p><b>Disponible:</b> el documento está incorporado y aún no lo has trabajado.</p>

    <p class="tiny muted">Las referencias usan la numeración del archivo (${fs.map(f=>f.unidad==="diap."?"diapositiva":"página del PDF").join(", ")}). Pulsa cualquier referencia para ver el texto de esa página.</p></section>
  ${alertas.length ? `<section class="card stack"><h2>Discrepancias y dudas para el profesor</h2><p class="small muted">La aplicación no decide qué versión prevalece. Consulta estas cuestiones en clase.</p>
    ${alertas.map(a=>`<div class="stack-s"><div class="row"><span class="chip ${a.tipo==="discrepancia"?"warn":"info"}">${a.tipo==="discrepancia"?"Discrepancia":"Consultar"}</span><b>${esc(a.titulo)}</b></div><p class="small">${esc(a.texto)}</p>${a.correccion?`<p class="small"><span class="chip ok">Práctica 1</span> ${esc(a.correccion)}</p>`:""}${a.aclaracion?`<p class="small"><span class="chip ok">${esc(a.aclaracionDe||"Aclaración")}</span> ${esc(a.aclaracion)}</p>`:""}${refsHTML(a.refs)}<p class="small muted">Pregunta sugerida: ${esc(a.pregunta)}</p></div>`).join("")}</section>` : ""}
  <div class="grid g2">
    <section class="card stack-s"><h2>Esquema de contenidos</h2><ol class="stack-s" style="padding-left:20px;margin:0">${t.esquema.map(e=>`<li><span>${esc(e[0])}</span> ${refsHTML(e[1])}</li>`).join("")}</ol></section>
    <section class="card stack-s"><h2>Conceptos esenciales</h2>${t.conceptos.map(c=>`<div><b>${esc(c[0])}.</b> <span class="small">${esc(c[1])}</span> ${refsHTML(c.slice(2))}</div>`).join("")}</section>
  </div>

/* ---------- ESTUDIAR ---------- */
let STUDY = { tema:null, nivel:1, bloque:0 };
function vEstudiar(){
  const disp = temasDisponibles();
  if (!disp.length) return `<div class="empty"><h2>No hay temas disponibles</h2><p>Incorpora el primer tema en <a href="#datos">Fuentes y datos</a>.</p></div>`;
  if (!STUDY.tema || !temaDisponible(STUDY.tema)) STUDY.tema = disp[0];
  const n = STUDY.tema; const s = temaStats(n);
  const niveles = [[1,"Comprender"],[2,"Recordar"],[3,"Aplicar"],[4,"Resolver como en el examen"]];
  const rec = recomendacionNivel(n);
  let body = "";
  if (STUDY.nivel === 1) body = nivelComprender(n);
  else if (STUDY.nivel === 2) body = nivelLista(n, ["tarjeta","test"], "Recordar", "Tarjetas de recuperación activa y test de apoyo. Decide tu confianza antes de ver la respuesta.");
  else if (STUDY.nivel === 3) body = nivelLista(n, ["corta","caso"], "Aplicar", "Preguntas cortas y minicasos. Escribe tu respuesta antes de ver nada.");
  else body = `<div class="card stack"><h2>Resolver como en el examen</h2><p>Configura un simulacro con el tema ${n} (o varios) con tiempo, sin pistas y con corrección al final.</p><div class="row"><button class="btn primary" type="button" data-act="sim-tema" data-tema="${n}">Configurar simulacro del tema ${n}</button></div></div>`;
  return `<div class="stack-s"><div class="eyebrow">Estudiar</div><h1>Ruta de aprendizaje</h1></div>
  <div class="row"><label for="st-tema" class="sr">Tema</label><select id="st-tema" data-bind="study-tema" style="max-width:420px">${disp.map(x=>`<option value="${x}" ${x===n?"selected":""}>Tema ${x}: ${esc(tituloTema(x))}</option>`).join("")}</select></div>
  <nav class="row" aria-label="Niveles">${niveles.map(([k,t])=>`<button type="button" class="btn ${STUDY.nivel===k?"sel":""}" data-act="nivel" data-n="${k}" aria-pressed="${STUDY.nivel===k}">${k}. ${t}</button>`).join("")}</nav>
  <div class="notice info"><b class="ico">→</b><span>${esc(rec)}</span></div>
  ${body}`;
}
function recomendacionNivel(n){
  const s = temaStats(n);
  if (s.leidos < s.bloques && s.ints.length === 0) return `Recomendación: empieza por Comprender. Has abierto ${s.leidos} de ${s.bloques} bloques. Puedes elegir otro nivel cuando quieras.`;
  const tarjetas = s.qs.filter(q=>q.tipo==="tarjeta"); const tHechas = tarjetas.filter(q=>lastAttempt(q.id)).length;
  if (tHechas < Math.ceil(tarjetas.length/2)) return `Recomendación: pasa a Recordar. Has respondido ${tHechas} de ${tarjetas.length} tarjetas.`;
  if (s.escritasFalladas) return `Recomendación: Aplicar. Tienes ${s.escritasFalladas} preguntas escritas con el último intento incorrecto o parcial.`;
  if (s.escritasCorrectas < Math.min(3, s.escritas.length)) return "Recomendación: Aplicar. Aún no hay evidencia suficiente de que lo resuelvas por escrito.";
  return "Recomendación: Resolver como en el examen. Tus últimas respuestas escritas de este tema son correctas.";
}
function nivelComprender(n){
  const t = TEMAS[n]; const b = t.bloques[clamp(STUDY.bloque,0,t.bloques.length-1)]; STUDY.bloque = t.bloques.indexOf(b);
  if (!S.leido[b.id]) { S.leido[b.id] = Date.now(); save(); }
  const chk = S.checks[b.id];
  return `<div class="grid" style="grid-template-columns:minmax(0,240px) minmax(0,1fr)" id="study-grid">
   <nav class="card flat stack-s" aria-label="Bloques del tema"><div class="eyebrow">Bloques</div>
     ${t.bloques.map((x,i)=>`<button type="button" class="btn small ${i===STUDY.bloque?"sel":""}" style="justify-content:space-between;text-align:left" data-act="bloque" data-i="${i}"><span>${i+1}. ${esc(x.titulo)}</span><span aria-label="${S.leido[x.id]?"abierto":"sin abrir"}">${S.checks[x.id]==="ok"?"✓":S.leido[x.id]?"·":""}</span></button>`).join("")}</nav>
   <article class="card stack">
     <div class="between"><div class="eyebrow">Bloque ${STUDY.bloque+1} de ${t.bloques.length}</div>${refsHTML(b.refs)}</div>
     <h2>${esc(b.titulo)}</h2>
     <div class="block"><ul>${b.texto.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
     ${b.ejemplo ? `<div class="example"><div class="tag">Ejemplo didáctico · no procede del temario</div><p>${esc(b.ejemplo)}</p><p class="tiny muted">Construido solo con las reglas citadas en este bloque.</p></div>`:""}
     <div class="card flat stack-s"><div class="eyebrow">Comprueba que lo has entendido</div><p><b>${esc(b.check.q)}</b></p>
       <textarea id="chk-${b.id}" style="min-height:70px" placeholder="Responde con tus palabras antes de ver la respuesta"></textarea>
       <div class="row"><button class="btn small" type="button" data-act="check-show" data-b="${b.id}">Ver respuesta</button>${chk?`<span class="tiny muted">Última vez: ${chk==="ok"?"la sabías":"no la sabías"}</span>`:""}</div>
       <div id="chk-out-${b.id}" hidden><p class="small"><b>Respuesta:</b> ${esc(b.check.a)} ${refBtn(b.check.ref)}</p>
       <div class="row"><span class="small">¿La sabías?</span><button class="btn small" type="button" data-act="check-mark" data-b="${b.id}" data-v="ok">Sí</button><button class="btn small" type="button" data-act="check-mark" data-b="${b.id}" data-v="no">No del todo</button></div></div></div>

<script>

/* ---------- Ejecución de preguntas (modo entrenamiento) ---------- */
let RUN = null; // {ids, i, origen, W:{...}}

function vPracticar(){

const confHTML = W => `<div class="conf" role="group" aria-label="Confianza"><span class="small"><b>¿Qué confianza tienes?</b></span>${[1,2,3].map(c=>`<button type="button" class="btn small ${W.conf===c?"sel":""}" aria-pressed="${W.conf===c}" data-act="conf" data-c="${c}">${CONF[c]}</button>`).join("")}</div>`;

function plantillaCaso(){ return "Hechos relevantes:\n\nCuestión jurídica:\n\nRegla del temario:\n\nAplicación a los hechos:\n\nConclusión:\n"; }
function pEscrita(q, W){

function rubricaItems(q){

      <div class="row"><button class="btn primary" type="button" data-act="auto-done" ${items.every(it=>W.marks[it.k]) && W.marks.claridad ? "" : "disabled"}>Ver mi resultado</button></div></div>`;

function solucionHTML(q, W){

async function entregar(){

      W.intentoId = registrarIntento({qid:q.id, modo:"entrenamiento", respuesta:W.resp, confianza:W.conf, resultado:fb.resultado, eval:"ia", nota:fb.nota, fb:{aciertos:fb.aciertos, omisiones:fb.omisiones, errores:fb.errores, criterios:fb.criterios, siguiente:fb.siguiente, refs:fb.refs}, tipoError:fb.tipo, pistas:W.pistas, segundos:W.segundos}).id;

function autoDone(){
  const W = RUN.W; const q = QMAP[W.qid]; const items = rubricaItems(q);

function resumenRun(){

/* ---------- Cuaderno de errores ---------- */
function cuadernoItems(){
  const byQ = {};
  for (const a of S.intentos){ if (a.resultado === "no_evaluable") continue; (byQ[a.qid] = byQ[a.qid] || []).push(a); }
  const out = [];
  for (const [qid, arr] of Object.entries(byQ)){
    const q = QMAP[qid]; if (!q) continue;
    const fallos = arr.filter(a=>a.resultado!=="correcta");
    if (!fallos.length) continue;
    const last = arr[arr.length-1];
    out.push({q, arr, fallos, last, abierto: last.resultado !== "correcta", r:S.repaso[qid], tipo: (S.repaso[qid]?.tipoError) || [...fallos].reverse().find(a=>a.tipoError)?.tipoError || null});
  }
  return out.sort((a,b)=> (b.abierto - a.abierto) || ((b.last.confianza===3 && b.abierto) - (a.last.confianza===3 && a.abierto)) || (b.last.ts - a.last.ts));
}
let ERRF = "abiertos";
function vErrores(){

   ${Object.keys(counts).length?`<span class="small muted">Dificultades: ${Object.entries(counts).map(([k,v])=>`${TIPOS_ERROR[k]} (${v})`).join(" · ")}</span>`:""}</div>
  ${items.length ? items.map(x=>{
    const q = x.q; const l = x.last;

    return `<article class="card stack-s"><div class="between"><div class="qhead"><span class="chip">Tema ${q.tema}</span><span class="chip">${tipoNombre[q.tipo]}</span>${origenChip(q)}${x.abierto?resChip(l.resultado):'<span class="chip ok">✓ Superada en el último intento</span>'}${l.confianza===3 && x.abierto?'<span class="chip bad">Confianza alta y fallo</span>':""}</div>
      <span class="small muted">Próximo repaso: ${x.r?.proximo?fmtD(x.r.proximo):"—"}</span></div>
      <p><b>${esc(q.enunciado)}</b></p>
      <details><summary class="small">Tu respuesta fallada (${fmtTS(prev.ts)}) y explicación</summary><div class="stack-s" style="margin-top:8px">
        <div class="srcpage">${esc(respTxt(prev)).slice(0,1800)}</div>
        ${prev.fb?.omisiones?.length?`<div class="small"><b>Omisiones o errores:</b><ul>${prev.fb.omisiones.map(o=>`<li>${esc(o)}</li>`).join("")}${(prev.fb.errores||[]).map(e=>`<li>“${esc(e.texto)}”: ${esc(e.por_que)}</li>`).join("")}</ul></div>`:""}
        <div class="small"><b>Explicación del temario:</b> ${esc(q.modelo || q.respuesta || (q.opciones?q.opciones.find(o=>o.ok).por:"") || (q.apartados||[]).map(a=>a.modelo).join(" "))}</div>
        <div>${refsHTML(prev.fb?.refs || q.refs)}</div></div></details>
      <div class="row small"><span><b>Intentos:</b> ${x.arr.map(a=>`<span title="${fmtTS(a.ts)}">${RES[a.resultado].i}</span>`).join(" ")}</span>
        <label class="row" style="font-weight:500">Dificultad: <select data-bind="err-tipo" data-q="${q.id}" style="width:auto">${[["","Sin clasificar"],...Object.entries(TIPOS_ERROR)].map(([k,v])=>`<option value="${k}" ${x.tipo===k?"selected":""}>${v}</option>`).join("")}</select></label></div>
      <div class="row"><button class="btn small primary" type="button" data-act="run-one" data-q="${q.id}">Nuevo intento</button></div></article>`;
  }).join("") : `<div class="empty"><b>${ERRF==="abiertos"?"No tienes errores abiertos":"Aún no hay registros"}</b><span class="small">Cuando una respuesta sea incorrecta o parcial, aparecerá aquí con su referencia y su próximo repaso.</span></div>`}

    <div class="row"><label for="iv" class="small">Intervalos (días, separados por comas)</label><input id="iv" type="text" value="${iv.join(", ")}" style="max-width:200px"><button class="btn small" type="button" data-act="save-iv">Guardar</button></div></section>`;
}

<script>

    <div class="grid g4">

   ${[...S.sims].filter(s=>s.estado==="terminado").reverse().map(s=>`<tr><td class="small">${fmtTS(s.inicio)}</td><td class="small">${esc(s.nombre)}${s.incompleto?' <span class="chip warn">Incompleto</span>':""}</td><td class="mono small">${s.nota!=null?String(s.nota).replace(".",",")+"/10":"No evaluable"}</td><td class="small">${fmtMin((s.segundos||0)/60)}</td><td><a class="btn small" href="#simulador-${s.n}">Ver</a></td></tr>`).join("")}</tbody></table></div></section>`:""}`;

function pickN(arr, n){ const a = [...arr]; for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(0,n); }
function simStart(){
  const c = SIMCFG; const disp = c.temas.filter(temaDisponible); const falt = c.temas.filter(n=>!temaDisponible(n));
  const pool = PREGUNTAS.filter(q=>disp.includes(q.tema) && (!c.dif || q.dif===+c.dif));
  // reparto equilibrado por tema
  const pickTipo = (tipo, n) => { const byT = disp.map(t=>pickN(pool.filter(q=>q.tipo===tipo && q.tema===t), 99)); const out=[]; let k=0; while(out.length<n && byT.some(x=>x.length)){ const l = byT[k%byT.length]; if (l.length) out.push(l.shift()); k++; } return out; };

  for (const q of qs) s.resp[q.id] = q.tipo==="caso" ? Object.fromEntries(q.apartados.map(a=>[a.id,""])) : (q.tipo==="test"?null:"");
  S.sims.push(s); save({sim:s.id}); go("simulador");

function simExamen(s){

  ${s.incompleto?`<div class="notice warn"><b class="ico">!</b><span>Simulacro incompleto: faltan los temas ${s.temasFaltan.join(", ")}. Solo cubre los temas ${s.temasIncluidos.join(", ")}.</span></div>`:""}

      <p class="q-text">${esc(q.enunciado)}</p>${inp}${inmediata && !done ? `<div class="row"><button class="btn small" type="button" data-act="sim-corr-one" data-q="${q.id}">Corregir esta pregunta</button></div>`:""}
      ${inmediata && s.marks[q.id]?.pendiente ? simAutoPanel(s,q) : ""}</section>`;

  <section class="card stack-s" id="sim-confirm"><div class="row"><button class="btn primary" type="button" data-act="sim-submit-ask">Entregar simulacro</button><button class="btn ghost" type="button" data-act="sim-abandon-ask">Abandonar sin corregir</button></div><div id="sim-confirm-box"></div></section>`;
}
function computeAuto(q, marks){
  const items = rubricaItems(q); const val = v => v==="si"?1:v==="parte"?0.5:0;

  return { resultado, nota: Math.round((sc*8+clar*2)*10)/10, faltan: items.filter(it=>marks[it.k]!=="si").map(it=>(it.ap?it.ap+") ":"")+it.t), aciertos: items.filter(it=>marks[it.k]==="si").map(it=>(it.ap?it.ap+") ":"")+it.t) };
}
function simAutoPanel(s, q){

async function simCorregirUna(s, q){
  const r = s.resp[q.id];

    const ok = r !== null && q.opciones[r]?.ok;

    try {
      const fb = await aiCorregir(q, r);
      s.resultados[q.id] = { resultado:fb.resultado, eval:"ia", nota:fb.nota, fb, tipo:fb.tipo };

function simCorreccion(s){

function simFinalizar(s){
  if (s.estado === "terminado") return;

function parseTemas(txt){
  const out = new Set();
  for (const part of String(txt).split(/[,;\s]+/)){ const m = part.match(/^(\d+)(?:-(\d+))?$/); if (!m) continue; const a=+m[1], b=+(m[2]||m[1]); for (let i=Math.min(a,b);i<=Math.max(a,b);i++) if (i>=1&&i<=16) out.add(i); }
  return [...out].sort((a,b)=>a-b);
}
function parseBloq(txt, year){
  const out = new Set();
  for (const p of String(txt).split(/[,;]+/)){ const m = p.trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/); if (!m) continue; let y = m[3] ? +m[3] : year; if (y<100) y+=2000; out.add(`${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`); }
  return out;
}
function generarPlan(){
  const c = planCfg(); const err = m => { const e = document.getElementById("pl-err"); if (e) e.textContent = m; };
  const ev = S.evals.find(e=>e.id===c.evalId);
  if (!ev) return err("Elige una evaluación (añádela arriba si no existe).");
  const examD = canaryLocalToDate(ev.fecha);
  if (!examD || isNaN(examD)) return err("La evaluación no tiene una fecha válida.");
  if (examD.getTime() <= Date.now()) return err("La fecha de la evaluación ya ha pasado. Corrígela antes de generar el plan.");
  const minDia = +c.minutos, dur = +c.sesion;
  if (!(minDia >= 15)) return err("Indica al menos 15 minutos disponibles al día.");
  if (!(dur >= 15) || dur > minDia) return err("La duración de sesión debe estar entre 15 minutos y tus minutos diarios.");
  const hoy = today(); const examDay = ev.fecha.slice(0,10); const p = canaryParts();
  const esHoy = examDay === hoy;
  if (!esHoy && !c.dias.length) return err("Marca al menos un día disponible.");
  const bloq = parseBloq(c.bloqueados, p.y);
  // días útiles
  const dias = [];
  if (esHoy){
    const minsHasta = Math.floor((examD.getTime() - Date.now())/60000) - 15;
    dias.push({fecha:hoy, min: Math.max(0, Math.min(minDia, minsHasta))});
  } else {
    for (let d = hoy; d < examDay; d = addDays(d,1)){
      if (bloq.has(d)) continue; if (!c.dias.includes(String(weekday(d)))) continue;
      dias.push({fecha:d, min:minDia});
    }
  }
  // historial conservado
  const hist = (S.plan?.sesiones||[]).filter(x=>x.estado!=="pendiente");
  const hechas = {}; for (const x of hist) if (x.clave) hechas[x.clave] = (hechas[x.clave]||0) + (x.estado==="realizada"?1:0.5);
  // unidades de trabajo
  const unidades = [];
  const prioTema = n => { const e = estadoTema(n); return e==="repaso"?3 : e==="disponible"?2 : e==="estudio"?2 : e==="dominio"?0.5 : 1; };
  for (const n of ev.temas){
    if (!temaDisponible(n)){ for (let k=1;k<=3;k++) unidades.push({clave:`prov-${n}-${k}`, tema:n, tipo:"provisional", prio:1, objetivo:`Tema ${n}: bloque provisional ${k}/3`, actividad:"Pendiente de recibir el tema. Carga estimada: se ajustará cuando incorpores el documento. Hasta entonces, usa este hueco para repasar errores."}); continue; }
    const s = temaStats(n); const e = estadoTema(n); const nb = s.bloques;
    let comp = Math.ceil(nb/3); if (c.nivel==="alto") comp = Math.ceil(comp/2); if (c.nivel==="bajo") comp += 1; if (e==="dominio") comp = 0;
    let apl = e==="dominio" ? 1 : e==="repaso" ? 3 : 2;
    const pr = prioTema(n);
    for (let k=1;k<=comp;k++) unidades.push({clave:`comp-${n}-${k}`, tema:n, tipo:"comprender", prio:pr+0.2, objetivo:`Tema ${n}: comprender (${k}/${comp})`, actividad:`5 min recuperar sin mirar · 15 min leer 2-3 bloques de “Estudiar” · 20 min preguntas de comprobación y tarjetas · 10 min registrar dudas.`});
    unidades.push({clave:`rec-${n}`, tema:n, tipo:"recordar", prio:pr, objetivo:`Tema ${n}: recordar`, actividad:"Tarjetas de recuperación activa con confianza declarada y test de apoyo. Anota lo que no recuerdes."});
    for (let k=1;k<=apl;k++) unidades.push({clave:`apl-${n}-${k}`, tema:n, tipo:"aplicar", prio:pr+0.1, objetivo:`Tema ${n}: aplicar por escrito (${k}/${apl})`, actividad:"Responder por escrito 2 preguntas cortas y 1 caso; corregir y registrar errores."});
  }
  const nSim = unidades.length > 10 ? 2 : 1;
  for (let k=1;k<=nSim;k++) unidades.push({clave:`sim-${k}`, tema:null, tipo:"simulacro", prio:2.5, objetivo:`Simulacro ${k}`, actividad:`Simulacro con tiempo de los temas disponibles de la evaluación${ev.temas.some(n=>!temaDisponible(n))?" (será incompleto mientras falten temas)":""}; después, revisión de errores.`});
  const nErr = Math.max(1, Math.round(unidades.length/6));
  for (let k=1;k<=nErr;k++) unidades.push({clave:`err-${k}`, tema:null, tipo:"errores", prio:2.4, objetivo:`Revisión de errores ${k}`, actividad:"Repasar el cuaderno de errores y reintentar por escrito las preguntas falladas."});
  // descontar lo ya hecho
  const pendientes = unidades.filter(u => !(hechas[u.clave] >= 1));
  // capacidad
  const slots = []; for (const d of dias){ let m = d.min; while (m >= dur){ slots.push({fecha:d.fecha, min:dur}); m -= dur; } if (m >= 15) slots.push({fecha:d.fecha, min:m}); }
  const avisos = [];
  if (esHoy) avisos.push({t:"info", m:`La evaluación es hoy. El plan cubre solo los ${fmtMin(dias[0]?.min||0)} disponibles antes de la hora del examen (con 15 minutos de margen).`});
  let margen = 0; if (!esHoy && slots.length > pendientes.length + 2) margen = Math.max(1, Math.floor(slots.length*0.1));
  const capacidad = slots.length - margen;
  let elegidas = pendientes;
  if (pendientes.length > capacidad){
    const orden = [...pendientes].sort((a,b)=> b.prio - a.prio || (a.tipo==="provisional") - (b.tipo==="provisional"));
    elegidas = orden.slice(0, Math.max(0,capacidad));
    const fuera = orden.slice(Math.max(0,capacidad));
    avisos.push({t:"bad", m:`Tu disponibilidad (${slots.length} sesiones) no permite cubrir todo el alcance (${pendientes.length} sesiones estimadas). Se priorizan los temas con peor rendimiento y la práctica escrita. Quedan fuera: ${fuera.map(u=>u.objetivo).join("; ")}.`});
  }
  if (ev.temas.some(n=>!temaDisponible(n))) avisos.push({t:"info", m:`Los temas ${ev.temas.filter(n=>!temaDisponible(n)).join(", ")} aún no están disponibles: sus bloques son provisionales y su carga es una estimación pendiente de actualizar.`});
  if (c.previos) avisos.push({t:"info", m:`Resultados previos anotados: “${c.previos}”. Úsalos para ajustar manualmente las sesiones si lo necesitas.`});
  // orden: intercalar temas, comprender → recordar → aplicar; simulacros y errores hacia el final
  const porTema = {}; for (const u of elegidas.filter(u=>u.tema!=null)) (porTema[u.tema] = porTema[u.tema] || []).push(u);
  const ordTipo = {comprender:0, recordar:1, aplicar:2, provisional:3};
  for (const k in porTema) porTema[k].sort((a,b)=>ordTipo[a.tipo]-ordTipo[b.tipo]);
  const temasOrd = Object.keys(porTema).sort((a,b)=>Math.max(...porTema[b].map(u=>u.prio)) - Math.max(...porTema[a].map(u=>u.prio)));
  const seq = []; let any = true; while (any){ any = false; for (const t of temasOrd){ if (porTema[t].length){ seq.push(porTema[t].shift()); any = true; } } }
  const finales = elegidas.filter(u=>u.tema==null);
  const errU = finales.filter(u=>u.tipo==="errores"), simU = finales.filter(u=>u.tipo==="simulacro");
  // insertar revisiones de errores repartidas y simulacros al final
  const total = [...seq]; errU.forEach((u,i)=>{ const pos = Math.min(total.length, Math.round((i+1)*total.length/(errU.length+1))); total.splice(pos,0,u); });
  total.push(...simU);
  const sesiones = [];
  const usable = slots.slice(0, slots.length - margen);
  total.forEach((u,i)=>{ const sl = usable[i]; if (!sl) return; sesiones.push({id:uid("p"), fecha:sl.fecha, min:sl.min, tema:u.tema, tipo:u.tipo, clave:u.clave, objetivo:u.objetivo, actividad:u.actividad, estado:"pendiente"}); });
  for (const sl of slots.slice(slots.length - margen)) sesiones.push({id:uid("p"), fecha:sl.fecha, min:sl.min, tema:null, tipo:"margen", clave:"margen", objetivo:"Margen para imprevistos", actividad:"Hueco libre. Si no lo necesitas, úsalo para repasar errores o hacer un simulacro corto.", estado:"pendiente"});
  if (!slots.length) avisos.push({t:"bad", m:"No hay ningún hueco disponible antes de la evaluación con la configuración actual. Revisa días disponibles, días bloqueados y minutos."});
  const all = [...hist, ...sesiones].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  S.plan = { config:c, sesiones:all, avisos, generado:Date.now() };
  save(); render();
}

/* ---------- GUÍA Y TEMPORIZADOR ---------- */
function fases(total){ const base = [5,15,20,10]; const k = total/50; const f = base.map(x=>Math.max(1, Math.round(x*k))); f[2] += total - f.reduce((a,b)=>a+b,0); return f; }
const FASES_N = ["Recuperar sin mirar","Comprender un bloque","Responder o resolver un caso","Corregir y registrar errores"];
let TIMER_MIN = 50;
function timerState(){
  const t = S.timer; if (!t) return null;
  const el = (t.acc||0) + (t.running ? (Date.now()-t.since)/1000 : 0);
  const f = fases(t.total); let acc = 0, idx = 0; for (let i=0;i<4;i++){ if (el < (acc + f[i]*60)) { idx = i; break; } acc += f[i]*60; idx = i; }
  return { el, rest: Math.max(0, t.total*60 - el), idx, f, fin: el >= t.total*60 };
}
function vGuia(){
  const t = S.timer; const st = timerState(); const f = fases(t?.total || TIMER_MIN);

function vProgreso(){

function validarPaquete(pkg){
  const inf = { pasos:[], ok:true, tipo:null, resumen:"" };
  const paso = (n, ok, msg) => { inf.pasos.push({n, ok, msg}); if (!ok) inf.ok = false; };
  if (!pkg || typeof pkg !== "object"){ paso("Lectura", false, "El archivo no es JSON válido."); return inf; }
  paso("Lectura", true, "Archivo JSON leído.");
  if (pkg.formato === "aula-laboral-progreso"){ inf.tipo = "progreso"; paso("Identificación", true, `Copia de progreso exportada el ${pkg.exportado?fmtTS(pkg.exportado):"(fecha desconocida)"} con ${(pkg.estado?.intentos||[]).length} respuestas.`); paso("Legibilidad", Array.isArray(pkg.estado?.intentos), Array.isArray(pkg.estado?.intentos)?"Estructura correcta.":"Faltan datos de intentos."); return inf; }
  if (pkg.formato !== "aula-laboral-paquete"){ paso("Identificación", false, "No es un paquete de Aula Laboral. Si es un PDF o PowerPoint, súbelo en la conversación con Claude."); return inf; }
  inf.tipo = "paquete";
  const fs = pkg.fuentes || [], ts = pkg.temas || {}, qs = pkg.preguntas || [];
  const ident = fs.map(f=>`Tema ${f.tema}: ${f.file} (${f.version})`).join("; ");
  paso("Identificación", fs.length>0 && fs.every(f=>f.id && f.tema>=1 && f.tema<=16 && f.paginas), fs.length ? `${ident}. Tipo: ${pkg.tipoDocumento||"tema"}.` : "El paquete no incluye fuentes.");
  for (const f of fs){
    const pags = Object.values(f.paginas||{}); const leg = pags.filter(t=>t && String(t).length>40).length;
    paso(`Legibilidad · ${f.file}`, pags.length>0 && leg/pags.length >= 0.5, `${leg} de ${pags.length} páginas con texto${leg/pags.length<0.5?": parece ilegible o requiere OCR; no se incorpora":""}.`);
  }
  const fmap = Object.assign({}, FMAP); for (const f of fs) fmap[f.id] = f;
  const badRefs = []; for (const q of qs) for (const r of (q.refs||[])) if (!(fmap[r[0]] && fmap[r[0]].paginas[r[1]]!==undefined)) badRefs.push(q.id+" → "+r.join(" "));
  paso("Referencias", badRefs.length===0, badRefs.length?`Referencias que no existen en el material: ${badRefs.slice(0,6).join(", ")}${badRefs.length>6?"…":""}`:`${qs.length} preguntas con referencias verificadas.`);
  const reempl = fs.filter(f=>FMAP[f.id] && FMAP[f.id].version !== f.version);
  inf.reemplazos = reempl.map(f=>({id:f.id, de:FMAP[f.id].version, a:f.version}));
  inf.resumen = `${fs.length} fuentes, ${Object.keys(ts).length} temas, ${qs.length} preguntas${reempl.length?`, sustituye ${reempl.length} documento(s)`:""}.`;
  return inf;
}

function confirmarImport(){
  const I = IMPORT; if (!I?.informe.ok) return;
  if (I.informe.tipo === "progreso"){
    const keepImp = S.importados; S = normalize(I.pkg.estado); if (!I.pkg.estado.importados) S.importados = keepImp;
    rebuildData(); for (const a of S.intentos) dirtyAttempts.add(a.id); for (const s of S.sims) dirtySims.add(s.id);
    save({imp:true}); IMPORT = null; toast("Progreso importado."); render(); return;
  }
  const pkg = I.pkg; const imp = S.importados;
  imp.historial = imp.historial || [];
  for (const f of pkg.fuentes){
    const prev = FMAP[f.id];
    if (prev && prev.version !== f.version){
      imp.historial.push({id:f.id, version:prev.version, file:prev.file, sustituido:Date.now()});
      for (const q of PREGUNTAS) if ((q.refs||[]).some(r=>r[0]===f.id)) S.revision[q.id] = true;
    }
    imp.fuentes = imp.fuentes.filter(x=>x.id!==f.id); imp.fuentes.push(Object.assign({incorporado:today()}, f));
  }
  Object.assign(imp.temas, pkg.temas || {});
  for (const q of pkg.preguntas || []){ imp.preguntas = imp.preguntas.filter(x=>x.id!==q.id); imp.preguntas.push(q); delete S.revision[q.id]; }
  imp.alertas = [...(imp.alertas||[]).filter(a=>!(pkg.alertas||[]).some(b=>b.id===a.id)), ...(pkg.alertas||[])];
  if (pkg.evaluaciones) imp.evaluaciones = [...(imp.evaluaciones||[]), ...pkg.evaluaciones];
  rebuildData(); save({imp:true}); IMPORT = null; toast("Contenido incorporado."); render();
}

  let dl = null; try { dl = window.claude?.use ? await window.claude.use("downloads") : null; } catch(e){}
  if (dl){ try { await dl.save({filename:name, data}); toast("Copia guardada."); return; } catch(e){ if (e?.code === "declined") { toast("Descarga cancelada."); return; } } }
  if (!window.claude){ try { const u = URL.createObjectURL(new Blob([data],{type:"application/json"})); const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 2000); toast("Copia descargada."); return; } catch(e){} }
  const box = document.getElementById("export-box");
  if (box){ box.innerHTML = `<div class="stack-s"><p class="small">La descarga directa no está disponible en esta vista. Copia este texto y guárdalo en un archivo <span class="mono">${name}</span>.</p><textarea id="export-txt" readonly style="min-height:160px" class="mono">${esc(data)}</textarea><div class="row"><button class="btn small" type="button" data-act="copy-export">Copiar</button></div></div>`; }
}

</script>
<script>
/* ===== Eventos y arranque ===== */
async function simEntregar(s){
  if (s.estado !== "en_curso") return;
  s.estado = "corrigiendo"; s.fin = Date.now(); s.segundos = Math.round((s.fin - s.inicio)/1000);
  s.corrigiendo = true; save({sim:s.id}); render();
  for (const id of s.qids){ const q = QMAP[id]; if (!q || s.resultados[id]) continue; await simCorregirUna(s, q); save({sim:s.id}); render(); }
  s.corrigiendo = false; save({sim:s.id}); render();
}
let draftTimer = null;
function saveDraft(simId){ clearTimeout(draftTimer); draftTimer = setTimeout(()=>save({sim:simId}), 600); }

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act; const d = el.dataset;
  if (act === "close-modal-bg" && ev.target !== el) return;
  switch(act){
    case "menu": { const s = document.getElementById("side"); const o = s.classList.toggle("open"); el.setAttribute("aria-expanded", o); break; }
    case "close-modal": case "close-modal-bg": closeModal(); break;
    case "ver-ref": showRef(d.src, +d.p); break;
    case "theme": S.prefs.tema = {sistema:"light", light:"dark", dark:"sistema"}[S.prefs.tema]; save(); render(); break;
    case "open-estudiar": STUDY = {tema:+d.tema, nivel:1, bloque:0}; go("estudiar"); break;
    case "nivel": STUDY.nivel = +d.n; render(); break;
    case "bloque": STUDY.bloque = +d.i; render(); document.getElementById("main").scrollIntoView(); break;
    case "check-show": document.getElementById("chk-out-"+d.b).hidden = false; break;
    case "check-mark": S.checks[d.b] = d.v; save(); toast(d.v==="ok"?"Anotado: la sabías.":"Anotado: conviene repasarla."); render(); break;
    case "run-tema": { const n = +d.tema; const tipos = +d.nivel===2 ? ["tarjeta","test"] : ["corta","caso"]; startRun(PREGUNTAS.filter(q=>q.tema===n && tipos.includes(q.tipo)).map(q=>q.id), "tema"); break; }
    case "run-list": startRun(d.ids.split(",").filter(Boolean), "lista"); break;
    case "run-one": startRun([d.q], "una"); break;
    case "run-repaso": startRun(pendientesRepaso().slice(0,12).map(x=>x.q.id), "repaso"); break;
    case "banco-tema": ev.preventDefault(); FILT = {tema:String(d.tema), tipo:"", dif:"", origen:"", estado:"", bloque:""}; go("banco"); break;
    case "run-exit": RUN = null; go("inicio"); break;
    case "run-skip": RUN.i++; if (RUN.i < RUN.ids.length) newWork(); render(); break;
    case "run-next": RUN.i++; if (RUN.i < RUN.ids.length) newWork(); render(); window.scrollTo(0,0); break;
    case "conf": RUN.W.conf = +d.c; render(); break;
    case "flip": RUN.W.fase = "ver"; render(); break;
    case "card-rate": { const W = RUN.W; const a = registrarIntento({qid:W.qid, modo:"entrenamiento", respuesta:W.resp, confianza:W.conf, resultado:d.r, eval:"recuerdo", segundos:Math.round((Date.now()-W.start)/1000)}); RUN.hechos.push(a.id); RUN.i++; if (RUN.i < RUN.ids.length) newWork(); render(); break; }
    case "test-check": { const W = RUN.W; const q = QMAP[W.qid]; const ok = q.opciones[W.resp]?.ok; const resultado = ok ? "correcta" : "incorrecta"; W.fb = {resultado}; W.fase = "feedback"; const a = registrarIntento({qid:q.id, modo:"entrenamiento", respuesta:W.resp, confianza:W.conf, resultado, eval:"test", tipoError: ok?null:"confusion_conceptual"}); RUN.hechos.push(a.id); render(); break; }
    case "pista": RUN.W.pistas++; render(); break;
    case "plantilla": { const ta = document.getElementById("w-"+d.ap); if (ta && !ta.value.trim()){ ta.value = plantillaCaso(); RUN.W.resp[d.ap] = ta.value; ta.focus(); } break; }
    case "entregar": await entregar(); if (RUN?.W?.intentoId) RUN.hechos.push(RUN.W.intentoId); break;
    case "toggle-corr": S.prefs.correccion = S.prefs.correccion === "ia" ? "auto" : "ia"; save(); render(); break;
    case "mark": RUN.W.marks[d.k] = d.v; render(); break;
    case "auto-done": autoDone(); if (RUN.W.intentoId) RUN.hechos.push(RUN.W.intentoId); break;
    case "retry": { const prev = RUN.W; newWork(prev); render(); break; }
    case "ver-sol": RUN.W.verSol = true; render(); break;
    case "errf": ERRF = d.k; render(); break;
    case "save-iv": { const v = document.getElementById("iv").value.split(/[,;\s]+/).map(Number).filter(n=>n>0 && n<366); if (!v.length) { toast("Escribe al menos un intervalo válido."); break; } S.prefs.intervalos = v; save(); toast("Intervalos guardados."); render(); break; }
    case "ask": {
      const q = document.getElementById("ask-q").value.trim(); const out = document.getElementById("ask-out"); if (!q){ out.innerHTML = `<p class="small">Escribe tu duda.</p>`; break; }
      out.innerHTML = `<div class="row"><span class="spinner" aria-hidden="true"></span><span class="small">Buscando en el material del tema…</span></div>`;
      try { const r = await aiPreguntar(+d.tema, q);
        out.innerHTML = r.puede ? `<div class="card flat stack-s"><p class="small">${esc(r.respuesta)}</p>${r.discrepancias?`<div class="notice warn small"><b class="ico">!</b><span>${esc(r.discrepancias)}</span></div>`:""}<div>${refsHTML(r.refs)}</div><p class="tiny muted">Respuesta generada con IA a partir del material; contrástala con las referencias.</p></div>`
          : `<div class="notice warn"><b class="ico">!</b><span><b>No se puede resolver con el material disponible.</b> ${esc(r.falta || "El tema no contiene información suficiente.")}</span></div>`;
      } catch(e){ out.innerHTML = `<div class="notice warn"><b class="ico">!</b><span>${aiErrorMsg(e)}</span></div>`; }
      break; }
    case "sim-tema": SIMCFG = Object.assign({}, SIMCFG, {preset:"custom", temas:[+d.tema], cortas:2, casos:1}); go("simulador"); break;
    case "preset": { const p = PRESETS[d.k]; SIMCFG.preset = d.k; if (d.k !== "custom") SIMCFG.temas = [...p.temas]; render(); break; }
    case "sim-start": simStart(); break;
    case "sim-submit-ask": document.getElementById("sim-confirm-box").innerHTML = `<div class="notice warn" style="margin-top:8px"><b class="ico">?</b><span>¿Entregar ahora? Ya no podrás cambiar las respuestas. <button class="btn small primary" type="button" data-act="sim-submit">Sí, entregar</button></span></div>`; break;
    case "sim-submit": { const s = simActivo(); if (s) await simEntregar(s); break; }
    case "sim-abandon-ask": document.getElementById("sim-confirm-box").innerHTML = `<div class="notice warn" style="margin-top:8px"><b class="ico">?</b><span>Se descartará este simulacro sin registrar resultados. <button class="btn small" type="button" data-act="sim-abandon">Sí, abandonar</button></span></div>`; break;
    case "sim-abandon": { const s = simActivo(); if (s){ s.estado = "abandonado"; save({sim:s.id}); } render(); break; }
    case "sim-corr-one": { const s = simActivo(); const q = QMAP[d.q]; el.disabled = true; el.textContent = "Corrigiendo…"; await simCorregirUna(s, q); save({sim:s.id}); render(); break; }
    case "sim-mark": { const s = simActivo(); s.marks[d.q] = Object.assign(s.marks[d.q]||{}, {[d.k]:d.v}); render(); break; }
    case "sim-auto-done": { const s = simActivo(); const q = QMAP[d.q]; const r = computeAuto(q, s.marks[d.q]); s.resultados[q.id] = {resultado:r.resultado, eval:"auto", nota:r.nota, fb:{omisiones:r.faltan, aciertos:r.aciertos, refs:q.refs}}; s.marks[d.q].pendiente = false;
      registrarIntento({qid:q.id, modo:"examen", simId:s.id, respuesta:s.resp[q.id], resultado:r.resultado, eval:"auto", nota:r.nota, fb:{omisiones:r.faltan, aciertos:r.aciertos, refs:q.refs}}); save({sim:s.id}); render(); break; }
    case "ev-add": {
      const n = document.getElementById("ev-n").value.trim(), t = document.getElementById("ev-t").value, f = document.getElementById("ev-f").value, tm = parseTemas(document.getElementById("ev-tm").value);
      const e = document.getElementById("ev-err");
      if (!n || !f || !tm.length){ e.textContent = "Completa nombre, fecha y hora, y temas (por ejemplo 5-8)."; break; }
      const dt = canaryLocalToDate(f); if (!dt || dt.getTime() <= Date.now()){ e.textContent = "La fecha y hora deben ser posteriores al momento actual (hora de Canarias)."; break; }
      const id = uid("e"); S.evals.push({id, nombre:n, tipo:t, fecha:f, temas:tm}); const c = planCfg(); c.evalId = id; S.plan = Object.assign(S.plan||{sesiones:[]}, {config:c}); save(); toast("Evaluación añadida."); render(); break; }
    case "ev-del": S.evals = S.evals.filter(e=>e.id!==d.id); save(); render(); break;
    case "plan-gen": generarPlan(); break;
    case "ses-est": { const x = S.plan.sesiones.find(s=>s.id===d.id); if (x){ x.estado = d.v; save(); render(); } break; }
    case "tm-start": S.timer = {total:TIMER_MIN, running:true, since:Date.now(), acc:0}; save(); render(); break;
    case "tm-pause": S.timer.acc += (Date.now()-S.timer.since)/1000; S.timer.running = false; save(); render(); break;
    case "tm-resume": S.timer.since = Date.now(); S.timer.running = true; save(); render(); break;
    case "tm-stop": timerStop(true); toast("Tiempo registrado."); break;
    case "tm-cancel": timerStop(false); break;
    case "tm-manual": { const f = document.getElementById("tm-f").value, m = +document.getElementById("tm-m").value, t = document.getElementById("tm-t").value; if (!f || !(m>0)) { toast("Indica fecha y minutos."); break; } S.tiempo.push({id:uid("t"), fecha:f, min:m, fuente:"manual", tema:t?+t:null}); save(); toast("Tiempo añadido."); render(); break; }
    case "export": exportar(); break;
    case "copy-export": { const ta = document.getElementById("export-txt"); try { await navigator.clipboard.writeText(ta.value); toast("Copiado."); } catch(e){ ta.select(); toast("Selecciona y copia el texto."); } break; }
    case "imp-confirm": confirmarImport(); break;
    case "imp-cancel": IMPORT = null; render(); break;
    case "wipe-ask": document.getElementById("wipe-box").innerHTML = `<div class="notice bad"><b class="ico">!</b><span>Se borrarán ${S.intentos.length} respuestas, el plan, el tiempo y los simulacros. Exporta antes una copia si la quieres. <button class="btn small" type="button" data-act="wipe">Borrar definitivamente</button></span></div>`; break;
    case "wipe": { const keep = S.importados; S = DEFAULT_STATE(); S.importados = keep; rebuildData(); try { localStorage.removeItem(LS_KEY); } catch(e){}
      if (STORE.col){ try { const snap = await STORE.col.get(); for (const doc of snap.docs) if (doc.id.startsWith("i_") || doc.id.startsWith("s_")) await STORE.col.doc(doc.id).delete(); } catch(e){} }
      save({imp:true}); toast("Progreso borrado."); render(); break; }
  }
  if (el.closest(".side") && el.tagName === "A") document.getElementById("side").classList.remove("open");
});
document.addEventListener("click", ev => { const a = ev.target.closest(".side a"); if (a) { document.getElementById("side").classList.remove("open"); document.querySelector('[data-act="menu"]')?.setAttribute("aria-expanded","false"); } });

document.addEventListener("input", ev => {
  const el = ev.target; const b = el.dataset?.bind; if (!b) return;
  switch(b){
    case "resp": RUN.W.resp = el.value; toggleEntregar(); break;
    case "resp-ap": RUN.W.resp[el.dataset.ap] = el.value; toggleEntregar(); break;
    case "sim-resp": { const s = simActivo(); s.resp[el.dataset.q] = el.value; saveDraft(s.id); break; }
    case "sim-ap": { const s = simActivo(); s.resp[el.dataset.q][el.dataset.ap] = el.value; saveDraft(s.id); break; }
    case "simcfg": SIMCFG[el.dataset.k] = el.type==="number" ? el.value : el.value; break;
    case "plcfg": { const c = planCfg(); c[el.dataset.k] = el.type==="number" ? +el.value : el.value; S.plan = Object.assign(S.plan||{sesiones:[]}, {config:c}); save(); break; }
    case "ses-edit": { const x = S.plan.sesiones.find(s=>s.id===el.dataset.id); if (x){ const k = el.dataset.k; x[k] = k==="min" ? Math.max(5, +el.value||5) : el.value; save(); } break; }
    case "tm-min": TIMER_MIN = clamp(+el.value||50, 10, 180); break;
  }
});
function toggleEntregar(){
  const btn = document.querySelector('[data-act="entregar"]'); if (!btn) return;
  const q = QMAP[RUN.W.qid]; const filled = q.tipo==="caso" ? Object.values(RUN.W.resp).some(v=>v.trim().length>10) : (RUN.W.resp||"").trim().length>10;
  btn.disabled = !(filled && RUN.W.conf);
}
document.addEventListener("change", async ev => {
  const el = ev.target; const b = el.dataset?.bind; if (!b) return;
  switch(b){
    case "study-tema": STUDY = {tema:+el.value, nivel:STUDY.nivel, bloque:0}; render(); break;
    case "filt": FILT[el.dataset.k] = el.value; render(); break;
    case "opt": RUN.W.resp = +el.value; render(); break;
    case "sim-opt": { const s = simActivo(); s.resp[el.dataset.q] = +el.value; saveDraft(s.id); break; }
    case "sim-tema": { const n = +el.value; SIMCFG.temas = el.checked ? [...new Set([...SIMCFG.temas, n])].sort((a,b)=>a-b) : SIMCFG.temas.filter(x=>x!==n); SIMCFG.preset = "custom"; render(); break; }
    case "simcfg": render(); break;
    case "pl-dia": { const c = planCfg(); c.dias = el.checked ? [...new Set([...c.dias, el.value])] : c.dias.filter(x=>x!==el.value); S.plan = Object.assign(S.plan||{sesiones:[]}, {config:c}); save(); break; }
    case "tipoerr": { RUN.W.tipoError = el.value || null; const a = S.intentos.find(x=>x.id===RUN.W.intentoId); if (a){ a.tipoError = RUN.W.tipoError; if (S.repaso[a.qid]) S.repaso[a.qid].tipoError = a.tipoError; save({intento:a.id}); } break; }
    case "err-tipo": { const r = S.repaso[el.dataset.q] || (S.repaso[el.dataset.q] = {paso:0}); r.tipoError = el.value || null; save(); render(); break; }
    case "ses-edit": render(); break;
    case "import-file": {
      const f = el.files?.[0]; if (!f) break;
      let pkg = null; try { pkg = JSON.parse(await f.text()); } catch(e){ pkg = null; }
      IMPORT = { nombre:f.name, pkg, informe: validarPaquete(pkg) }; el.value = ""; render();
      break; }
  }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && document.querySelector(".modal")) closeModal(); });
window.addEventListener("hashchange", () => { VIEW = parseHash(); render(); document.getElementById("main").focus({preventScroll:true}); window.scrollTo(0,0); });
setInterval(updateTimerUI, 1000);

/* Arranque */
(function boot(){
  S = normalize(loadLocal()); rebuildData();
  VIEW = parseHash();
  if (VIEW.name === "practicar" && !RUN) VIEW = {name:"inicio", arg:null};
  render();
  initStore(); initAI();
})();

</script></body></html>
